# VSCode プラグインの配布物（.vsix）を手動で作る。
#
# マーケットプレイスには出していないので、利用者は .vsix を「VSIX からのインストール」で入れる
# （docs/vscode-plugin-usage.md の「入れ方」）。手元に Node・Maven・JDK を揃えなくても
# 配布物を作れるよう、Actions の画面から起こせる経路をここに置く。
#
# smoke.yml の vscode-plugin ジョブでも .vsix はできるが、あれは push/PR ごとの検査の
# 副産物で、欲しいときに任意のブランチ・タグから起こすことはできない。こちらは
# workflow_dispatch だけなので、画面の「Run workflow」でブランチやタグを選んで動かす。
#
# 組み立てと中身の確認は test/vscode/package.sh（smoke.yml と同じもの）に任せる。
# 版は vscode-plugin/package.json の version がそのまま .vsix の名前の外にある
# （ファイル名は java-call-hierarchy-exporter.vsix 固定）ので、アーティファクト名に版を入れて
# ダウンロードしたものが何の版か分かるようにする。
name: vsix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # lib/ に入れる解析本体は eclipse-plugin のビルド（mvn package）から集める。
      # eclipse-plugin/pom.xml は release 17 と 8 を出すが、最近の Eclipse platform の jar は
      # Java 21 の class ファイルなので、ビルドに使う JDK は 21 以上が要る
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode-plugin/package-lock.json

      - name: Cache Maven repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('eclipse-plugin/pom.xml') }}

      # lib/ を集める → .vsix を作る → 中身（同梱する JDT の版、入るもの・入らないもの）を確認する。
      # npm ci はこのスクリプトが（node_modules が無ければ）行う。
      #
      # 拡張の中身の検査（npm test＝型検査と Node だけで動く層）はここでは動かさない。
      # あれは解析本体のクラスパスと java の場所を JCHE_CP / JCHE_JAVA などで渡してもらう前提で、
      # 素の npm test では「解析に使う java が見つかりません」で落ちる。渡す役は test/vscode/run.sh で、
      # そのために jbang で依存を解決して src/ 全体をコンパイルする（JDK 25）。
      # 配布物を作るだけのここでそれを繰り返す値打ちは無いので、検査は smoke.yml の
      # vscode-plugin ジョブに任せる（eclipse-plugin-jar.yml と同じ切り分け）
      - name: Build the .vsix
        run: bash test/vscode/package.sh

      - name: Read the version
        id: meta
        run: echo "version=$(node -p "require('./vscode-plugin/package.json').version")" >> "$GITHUB_OUTPUT"

      # v7 なのは Node.js 24 で動く版だから。v4 は Node.js 20 を指しており、
      # ランナーが強制的に 24 で動かすため「Node.js 20 is deprecated」の注記が出る
      # （eclipse-plugin-jar.yml・smoke.yml と同じ版。docs/github-actions-qa.md の Q26）
      - uses: actions/upload-artifact@v7
        with:
          name: java-call-hierarchy-exporter-${{ steps.meta.outputs.version }}-vsix
          path: vscode-plugin/java-call-hierarchy-exporter.vsix
          if-no-files-found: error

      # ダウンロードしたあと何をすればよいかを、実行のサマリに出しておく
      # （eclipse-plugin-jar.yml と同じ作り）
      - name: Summary
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          VSIX=vscode-plugin/java-call-hierarchy-exporter.vsix
          {
            echo "### VSCode プラグイン"
            echo ""
            echo "- \`java-call-hierarchy-exporter.vsix\`（版 $VERSION、$(du -h "$VSIX" | cut -f1)）"
            echo "- 下の **java-call-hierarchy-exporter-$VERSION-vsix** をダウンロードし、zip を展開する"
            echo "- VSCode の 拡張機能 → \`…\` → 「VSIX からのインストール」で入れる"
            echo "- 解析には JDK 17 以上が要る。詳しい手順は [docs/vscode-plugin-usage.md](../blob/${GITHUB_SHA}/docs/vscode-plugin-usage.md)"
          } >> "$GITHUB_STEP_SUMMARY"
