name: smoke

on:
  push:
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # ツール自身は //JAVA 25 で動く。期待出力も同じ JDK で作る
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # ラッパー（jbangw/jbang）は jbang 本体を ~/.jbang に、依存 jar を ~/.m2 に置く
      - name: Cache jbang and dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.jbang
            ~/.m2/repository
          key: jbang-${{ hashFiles('jbangw/jbang', 'src/jche/CallHierarchyExporter.java') }}

      # jbang が解決した JDT の jar を classpath にして、全ソースを警告ゼロでコンパイルできることを確認する。
      # jbang 自身がビルドしたスクリプトの jar（~/.jbang/cache/jars）は除く。残すと javac がそちらの class を使い、
      # ソースの一部が lint 対象から外れる。
      - name: Compile with all lint warnings as errors
        run: |
          CP=$(bash jbangw/jbang info classpath src/jche/CallHierarchyExporter.java | tr ':' '\n' | grep -v '/cache/jars/' | paste -sd:)
          javac --release 17 -Xlint:all -Werror -Xdoclint:all,-missing \
                -cp "$CP" -d build/classes -encoding UTF-8 $(find src -name '*.java')

      # サーバーモード（Eclipse プラグインが別プロセスで解析させる経路）の検査。
      # 上のコンパイルで作った build/classes をそのまま使うので、依存の解決は1回で済む
      - name: Server protocol test
        run: |
          CP=$(bash jbangw/jbang info classpath src/jche/CallHierarchyExporter.java | tr ':' '\n' | grep -v '/cache/jars/' | paste -sd:)
          JCHE_CP="$CP:$PWD/build/classes" bash test/server/run.sh

      # maven / mavenmulti / gradle のケースも、ビルドツール無しで動く（ビルドファイルを読むだけ）
      - name: Regression test (test/demo, test/maven-demo, test/maven-multi, test/gradle-demo)
        run: bash test/regression/run.sh

      # CallResolver.resolve が呼ぶ順・回数によらず同じ結果を返すこと（Issue #80）。
      # test/demo の全エッジを「昇順 → もう一度昇順 → 新しい resolver で降順」の 3 通りで解決して突き合わせる
      - name: Resolve order-independence test (test/dataflow)
        run: bash test/dataflow/run.sh

      # conditions.target を書いたときに追加で出る call-conditions.csv。判定できる条件・できない条件の
      # 出し分けと、通常の出力（call-hierarchy.csv / methods.csv / キャッシュ）が変わらないことを見る
      - name: Call conditions test (conditions.target)
        run: bash test/conditions/run.sh

      # コンストラクタ本体の読み取り（JLS 8.8.7）。柔軟なコンストラクタ本体（JEP 513）で
      # this(...) の前に文を書いた形を「委譲していない」と取り違えないこと。この構文は
      # Java 25 でしか書けないので test/demo には置かず、使い捨てのプロジェクトをその場で作る
      - name: Constructor body test (JEP 513 flexible constructor bodies)
        run: bash test/ctorbody/run.sh

      # 値の読み違いで呼び出しを黙って落とさないこと（値を変えうるキャスト・浮動小数・16 進のリテラル・
      # 複合代入と ++・ループの中で写した変数・型の揃わない equals・引数やフィールドへの new・
      # 匿名クラスのフィールド初期化子）。仕組みごとの対照は打ち切られること。
      # 使い捨てのプロジェクトをその場で作る
      - name: Value safety test (no false pruning or narrowing)
        run: bash test/pruning/run.sh

      # Java 言語仕様（JLS SE 26）への適合と javac との整合。test/jls/project/src の各ソースが JLS の
      # 1 つの節に対応し（パッケージ名が節番号）、節ごとの期待値（test/jls/expect.tsv）と、同じソースを
      # javac 26（--release 26）でコンパイルしたバイトコードとの突き合わせで見る。
      # ツール本体は JDK 25 のまま動かし、javac 26 と検査プログラムの JDK 26 は jbang が取得する
      - name: JLS SE 26 conformance and javac 26 cross-check
        run: bash test/jls/run.sh

      # 確認してほしいことの案内（warnings.txt）。正常な状態では作らず、依存 jar の不足・
      # 設定の指定先の欠け・コンパイルエラー・実行の失敗で作ること。使い捨てのプロジェクトをその場で作る
      - name: Warnings file test (warnings.txt)
        run: bash test/warnings/run.sh

      # キャッシュの列の符号化（joinRow が書き、CacheReader が戻す 1 つの規則）。SQL やログ文言のような
      # 長さも中身も選べない文字列をそのまま持つための土台なので、全制御文字・バックスラッシュの連なりまで
      # 機械的にかける
      - name: Cache value encoding test (escape round-trip)
        run: bash test/cachevalue/run.sh

      # 同梱の契約表（JDK のコールバック・フレームワークの入口）。全行が parse でき、JDK の型は
      # 宣言元と呼び戻すメソッドが実在すること。継承しているだけの型で書いた行は永久に当たらない
      - name: Bundled contracts test (parse and JDK declaring types)
        run: bash test/contracts/run.sh

      # キャッシュの健全性の検査。ソースを書き換えたあとの差分更新の結果が、キャッシュを消してからの
      # 全件解析の結果と一致すること（CSV とキャッシュの両方）。2 段のコンパイル時定数・
      # 注釈の既定値・列挙定数の改名・行形式を壊しかねない値を対象にする。
      # あわせて、文字コードを変えたときと壊れたキャッシュのときに再利用せず捨てること
      # （1 ブロックだけ壊れていればそのファイルだけ解析し直すこと）、中断した実行が残した一時ファイルから
      # 解析済みのぶんを引き継ぐこと、以前の形式が残した dataflow-cache.tsv を消すことも見る
      - name: Cache integrity test (differential update equals full analysis)
        run: bash test/incremental/run.sh

      # キャッシュの形式の版（CacheFormat.VERSION）の上げ忘れを捕まえる。決まった題材を全件解析した
      # キャッシュの事実の指紋を test/cacheversion/facts.txt に記録しておき、版・題材・環境が同じなのに
      # 事実が変わったら落とす（迷ったら上げる。上げ忘れは検査で捕まえる）
      - name: Cache format version guard (facts changed without a version bump)
        run: bash test/cacheversion/run.sh

      # 起動コマンド（java-call-hierarchy-exporter.sh）と対話モード（src/jche/Jche.java）。メニューへの答えをパイプで流し込んで動かす。
      # 標準入力が端末でないので、初回の「置き場所を選ぶ」問いは出ず、~/.jbang（上のキャッシュ）をそのまま使う。
      # 起動コマンドはネットワークからの取得の前に確認を出し、端末が無ければ取得せずに終わる（Issue #86）。
      # ここでは上のステップで JBang・依存 jar が取得済み、JDK 25 は setup-java のものなので、確認に掛からず動く
      - name: CLI test (java-call-hierarchy-exporter.sh launcher and interactive mode)
        run: bash test/cli/run.sh

      # 文言（英語が既定、日本語は重ねる）。ソースに日本語のリテラルが残っていないこと、
      # 英語と日本語でキーと差し込みがそろうこと、言語の決まり方（環境変数 > 設定ファイル > OS）、
      # そして出力 CSV が言語で変わらないこと（CSV は英語で固定）を見る（docs/nls-qa.md）
      - name: Message bundle test (English default, Japanese overlay)
        run: bash test/nls/run.sh

  # Windows でラッパーを実際に動かす。ラッパーの分岐はほとんどが Windows 固有
  # （javac.exe、パスの \、cmd の遅延展開、powershell への委譲）で、ubuntu 側では
  # 一行も通らない。test\regression\run.cmd は今まで CI で動かしていなかった。
  # ~/.jbang のキャッシュは使わない。毎回まっさらな状態から取得させて、
  # ブートストラップ経路そのものを検査対象に含めるため。
  regression-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Regression test (Windows, jbangw\jbang.cmd)
        shell: cmd
        run: test\regression\run.cmd

      # 起動コマンド java-call-hierarchy-exporter.cmd。ラッパーと同じく分岐のほとんどが Windows 固有（%~dp0、for /f、遅延展開の回避、
      # timeout による端末判定）なので、ここで実際に動かす。標準入力が端末でないので初回の問いは出ない。
      # ネットワークからの取得の確認（Issue #86）も、上の run.cmd で JBang と依存 jar が %userprofile% に取得済み、
      # JDK 25 は setup-java のものなので掛からない（掛かると取得せずに終了コード 3 で終わり、出力フォルダができない）。
      # 1) 対話なし: 引数の設定ファイルを解析して出力フォルダができること
      # 2) 対話モード: メニューの答え（4 = 状態表示, Enter, q）をパイプで流し込み、状態表示の行が出ること
      #    launcher.properties にヒープ上限を書いておき、-R で JVM に渡ったこと（ヒープ上限の表示）も見る
      - name: Launcher test (Windows, java-call-hierarchy-exporter.cmd)
        shell: cmd
        run: |
          if exist test\regression\entry\output rmdir /s /q test\regression\entry\output
          rem 出力はリダイレクトせず、そのまま CI のログへ流す。ログファイルに入れてしまうと、
          rem 起動コマンドがバッチとして致命的に失敗したとき（cmd がその場でバッチ処理ごと打ち切る）に
          rem 原因のメッセージがファイルの中に残ったまま type までたどり着けず、何も分からなくなる
          call java-call-hierarchy-exporter.cmd test\regression\entry\config.properties
          echo [launcher] exit=%ERRORLEVEL%
          rem 出力フォルダ名は <日時>_demo で実行のたびに変わる。cmd の if exist はワイルドカードを
          rem 「最後のファイル名」の位置でしか解釈しないので、途中のフォルダ名に * を書いた条件は常に偽になる。
          rem フォルダは for /d で走査して、その中の CSV を if exist で見る
          set "FOUND="
          for /d %%D in (test\regression\entry\output\*_demo) do if exist "%%D\call-hierarchy.csv" set "FOUND=1"
          if not defined FOUND (echo FAIL: no output folder & exit /b 1)
          > launcher.properties (
            echo JBANG_DIR=
            echo JBANG_REPO=
            echo JCHE_JAVA_OPTS=-Xmx640m
            echo JCHE_JBANG_OPTS=
          )
          (echo 4& echo.& echo q) | call java-call-hierarchy-exporter.cmd > launcher-status.log 2>&1
          type launcher-status.log
          findstr /c:"java.home" launcher-status.log > nul || (echo FAIL: status screen missing & exit /b 1)
          findstr /c:"640 MB" launcher-status.log > nul || (echo FAIL: JCHE_JAVA_OPTS not applied & exit /b 1)
          del launcher.properties
          echo OK

      # ネットワークからの取得の確認（Issue #86）を Windows でも通す。ランナーには端末が無いので、
      # 尋ねられず、何も取得せずに終了コード 3 で終わること。JBANG_DIR を空のフォルダに向けて確認を起こす。
      # 端末がある経路（choice の /t と /d）はランナーでは再現できないので、書き方の検査は
      # test/cli/run.sh（Linux 側）が受け持つ（docs/network-download-confirm-qa.md の Q18）
      - name: Launcher refuses to download without a terminal (Windows)
        shell: cmd
        run: |
          if exist probe-jbang rmdir /s /q probe-jbang
          mkdir probe-jbang
          > launcher.properties (
            echo JBANG_DIR=probe-jbang
            echo JBANG_REPO=probe-repo
            echo JCHE_JAVA_OPTS=
            echo JCHE_JBANG_OPTS=
            echo JCHE_ALLOW_DOWNLOAD=
          )
          call java-call-hierarchy-exporter.cmd test\regression\entry\config.properties
          set "CODE=%ERRORLEVEL%"
          echo [launcher] exit=%CODE%
          del launcher.properties
          if not "%CODE%"=="3" (echo FAIL: exit code should be 3 & exit /b 1)
          if exist probe-jbang\bin\jbang.jar (echo FAIL: JBang was downloaded & exit /b 1)
          if exist probe-repo (echo FAIL: dependencies were downloaded & exit /b 1)
          rmdir /s /q probe-jbang
          echo OK

      # 失敗したときに実際の出力を持ち帰れるようにする。Windows と Linux で
      # 出力が食い違ったとき、ログの差分だけでは追いきれないため
      - name: Upload output on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: regression-output-windows
          path: |
            test/regression/*/output/
            test/regression/*/run-*.log
            test/regression/run-*.log
          if-no-files-found: warn

      # jbangw\jbang.cmd が jbang 本体の終了コードを呼び出し元へ返すかを見る。返せるのは
      # 委譲を exit /b !ERRORLEVEL! で書いたときで、%ERRORLEVEL% だと括弧ブロックの
      # 解析時に展開されて常に 0 になり、run.cmd の "if errorlevel 1" が失敗を検知できない。
      #
      # 現在の jbangw/ は本家 main そのままで、この修正はコミット 314c140（本家から取り直し）
      # で巻き戻っている。つまりこの検査は今は通らない。ジョブ全体を赤にし続けると本当の
      # 失敗に気づけなくなるので、continue-on-error で警告にとどめて結果はログに残す。
      # 修正を当て直したら continue-on-error を外し、ふたたび失敗として扱うこと
      # （背景は jbangw/README.md）
      - name: jbang.cmd propagates a failing exit code (known to fail; see jbangw/README.md)
        shell: cmd
        continue-on-error: true
        run: |
          call jbangw\jbang.cmd run no-such-file-should-not-exist.java
          if errorlevel 1 (
            echo OK: non-zero exit code was propagated
            exit /b 0
          ) else (
            echo FAIL: a failing run reported success
            exit /b 1
          )

  # action.yml（GitHub Actions から使うための複合アクション）を、このリポジトリ自身で動かす。
  # 利用者のワークフローが通る経路そのものなので、設定ファイルを生成する経路（入力から作る）と
  # 用意した設定ファイルを渡す経路の両方を通し、アクションの出力（csv / methods-csv / output-dirs）が
  # 実在するファイルを指すことまで見る。
  # ~/.jbang のキャッシュはアクション自身が持つ（cache 入力）ので、ここでは actions/cache を書かない
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 入力から設定ファイルを生成する経路。JDK の用意も JBang の取得もアクションの中で行う
      - name: Export call hierarchy (generated config)
        id: generated
        uses: ./
        with:
          project-root: test/demo
          source-folders: src
          source-encoding: UTF-8
          external-library-folders: extjars
          upload-artifact: 'false'

      # アクションの出力は env 経由で渡す（run: の中に ${{ }} を直接書かない書き方）
      - name: Check outputs (generated config)
        env:
          OUTPUT_DIR: ${{ steps.generated.outputs.output-dir }}
          CSV: ${{ steps.generated.outputs.csv }}
          METHODS_CSV: ${{ steps.generated.outputs.methods-csv }}
          RUN_LOG: ${{ steps.generated.outputs.run-log }}
        run: |
          test -s "$CSV"
          test -s "$METHODS_CSV"
          test -s "$RUN_LOG"
          # 生成した設定ファイルの複製が出力フォルダに入っていること
          test -f "$OUTPUT_DIR/config.properties"
          head -1 "$CSV"

      # AST 解析キャッシュの引き継ぎ。1 回目の解析でできた .cache/（uses: ./ なのでワークスペース直下）を
      # 使って、ソースの更新時刻を全部変えてから（actions/checkout 後と同じ状況の再現）同じ入力でもう一度解析し、
      # 全ファイルが再利用されること（集計行の「新規解析=0」）を run.log で見る。
      # 実行間の保存・復元（actions/cache/restore・save）は同じジョブの中では検査できないので、
      # ここでは「更新時刻が変わっても再利用される」というツール側の条件だけを確かめる
      - name: Touch all sources (simulate a fresh checkout)
        run: find test/demo -type f -exec touch {} +

      - name: Export call hierarchy (generated config, second run)
        id: generated2
        uses: ./
        with:
          project-root: test/demo
          source-folders: src
          source-encoding: UTF-8
          external-library-folders: extjars
          upload-artifact: 'false'

      - name: Check the analysis cache was reused
        env:
          RUN_LOG: ${{ steps.generated2.outputs.run-log }}
        run: |
          # フェーズ1の集計行「ソース解析: 再利用=N 新規解析=M 失敗=F」。N が 0 でなく M が 0 であること
          line=$(grep -E -m1 '=[0-9]+.*=[0-9]+.*=[0-9]+[[:space:]]*$' "$RUN_LOG")
          echo "$line"
          printf '%s\n' "$line" | grep -q -E '^[^=]*=[1-9]'
          printf '%s\n' "$line" | grep -q -E '^[^=]*=[0-9]+[^=]*=0([^0-9]|$)'

      # 用意した設定ファイルを渡す経路。複数渡せること（出力フォルダが 2 つ）と、
      # java-version を空にすると JDK のセットアップを飛ばすこと（前のステップの JDK を使う）も通す
      - name: Export call hierarchy (existing config files)
        id: existing
        uses: ./
        with:
          config: |
            test/regression/whole/config.properties
            test/regression/entry/config.properties
          java-version: ''
          cache: 'false'
          artifact-name: call-hierarchy-regression-configs

      - name: Check outputs (existing config files)
        env:
          OUTPUT_DIRS: ${{ steps.existing.outputs.output-dirs }}
          CSV: ${{ steps.existing.outputs.csv }}
        run: |
          # 設定ファイル 2 つぶんの出力フォルダが並ぶ
          test "$(printf '%s\n' "$OUTPUT_DIRS" | grep -c .)" = 2
          test -s "$CSV"

  # 同梱した JBang ラッパー（jbangw/）の検査。ファイルの中身を読むだけなので
  # JDK も jbang も要らず、数秒で終わる。
  # regression とは別ジョブにしてあるのは ~/.jbang を巻き込まないため。regression 側は
  # ~/.jbang を actions/cache で保存するので、そこへ書き込むものを同じジョブに置くと
  # 壊れた状態がキャッシュに残る。このジョブはキャッシュを使わない。
  jbangw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: JBang wrapper check
        run: bash test/jbangw/run.sh

      # 複合アクションが依存 jar の警告を英語・日本語どちらのログからも拾うこと。
      # jbang はスタブに差し替えて解析は動かさないので、これも数秒で終わる
      - name: Action dependency-jar warning test
        run: bash test/action/run.sh

  # Eclipse（Pleiades）用の pom.xml の検査。
  # 1) //DEPS 行と pom.xml の依存が同じ版であること（ファイルを読むだけ、数秒）
  # 2) その pom.xml で実際に依存が解決でき、ソースがコンパイルできること
  #    （Eclipse の m2e がやることと同じ解決を Maven で再現する。JDK は pom の release と同じ 17）
  # regression ジョブとは別ジョブにしてあるのは、~/.m2 のキャッシュキーを jbang のものと混ぜないため。
  pom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: DEPS / pom.xml consistency check
        run: bash test/pom/run.sh

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile with Maven
        run: mvn -B --no-transfer-progress compile

  # Eclipse プラグイン（eclipse-plugin/）の検査。
  # 1) 版・ID・クラスの実在、解析本体がバンドルのクラスパスに混ざっていないこと（ファイルを読むだけ）
  # 2) 下限の Eclipse（4.17 / 2020-09）の jar と --release 11 でプラグインがコンパイルできること。
  #    本番のビルドは新しい jar を使うので、この検査だけが「下限の Eclipse でも動く」を守る
  # 3) 自動生成した設定が、解析側と同じ読み方でそのまま読み戻せること（Windows のパスの逃がし）
  # 4) 文言が英語・日本語で出し分けられること（既定は英語。Pleiades は訳してくれない）
  # 5) 子プロセスとのやりとり（クライアント層）が実際に動くこと
  # 6) バンドル jar が組み立てられること（解析本体は release 17、プラグインは release 11）
  eclipse-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Plugin definition consistency check
        run: bash test/plugin/run.sh

      # ビルドに使う JDK。出力する class ファイルの版は pom の release（17 と 8）で
      # 決まるので、ここは新しくてよい。むしろ新しくないと駄目で、最近の Eclipse
      # platform の jar は Java 21 の class ファイル（版 65）なので、JDK 17 の
      # javac では「class file has wrong version 65.0」で読めない
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Minimum-Eclipse / Java 11 compatibility check
        run: bash test/plugin-api/run.sh

      - name: Generated config round-trip test
        run: bash test/plugin-config/run.sh

      - name: Message bundle (English / Japanese) test
        run: bash test/plugin-nls/run.sh

      - name: Build the bundle jar
        run: mvn -B --no-transfer-progress -f eclipse-plugin/pom.xml package

      - name: Plugin client test
        run: bash test/plugin-client/run.sh

  # VSCode プラグイン（vscode-plugin/）の検査。
  # 画面は VSCode 本体が無いと動かせないので、その下の層――子プロセスを起動し、プロトコルで話し、
  # 返ってきた行を木に組み直す・設定ファイルを用意する――だけを Node で検査する
  # （Eclipse 版の plugin-client と対になる。docs/vscode-plugin-design.md §10）。
  # 解析本体は regression ジョブと同じ手順（jbang で依存を解決してコンパイル）で用意する
  vscode-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode-plugin/package-lock.json

      - name: Cache jbang and dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.jbang
            ~/.m2/repository
          key: jbang-${{ hashFiles('jbangw/jbang', 'src/jche/CallHierarchyExporter.java') }}

      - name: VSCode plugin client test
        run: bash test/vscode/run.sh

      # 配布物（.vsix）。lib/ は eclipse-plugin のビルドから集める（出どころを1つにするため）
      - name: Cache Maven repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('eclipse-plugin/pom.xml') }}

      - name: VSCode plugin package test (.vsix)
        run: bash test/vscode/package.sh

      - uses: actions/upload-artifact@v7
        with:
          name: java-call-hierarchy-exporter-vsix
          path: vscode-plugin/java-call-hierarchy-exporter.vsix
          if-no-files-found: error
