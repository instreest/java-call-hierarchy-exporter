name: smoke

on:
  push:
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ツール自身は //JAVA 25 で動く。期待出力も同じ JDK で作る
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # ラッパー（jbangw/jbang）は jbang 本体を ~/.jbang に、依存 jar を ~/.m2 に置く
      - name: Cache jbang and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.jbang
            ~/.m2/repository
          key: jbang-${{ hashFiles('jbangw/jbang', 'src/CallHierarchyExporter.java') }}

      # jbang が解決した JDT の jar を classpath にして、全ソースを警告ゼロでコンパイルできることを確認する。
      # jbang 自身がビルドしたスクリプトの jar（~/.jbang/cache/jars）は除く。残すと javac がそちらの class を使い、
      # ソースの一部が lint 対象から外れる。
      - name: Compile with all lint warnings as errors
        run: |
          CP=$(bash jbangw/jbang info classpath src/CallHierarchyExporter.java | tr ':' '\n' | grep -v '/cache/jars/' | paste -sd:)
          javac --release 17 -Xlint:all -Werror -Xdoclint:all,-missing \
                -cp "$CP" -d build/classes -encoding UTF-8 $(find src -name '*.java')

      # サーバーモード（Eclipse プラグインが別プロセスで解析させる経路）の検査。
      # 上のコンパイルで作った build/classes をそのまま使うので、依存の解決は1回で済む
      - name: Server protocol test
        run: |
          CP=$(bash jbangw/jbang info classpath src/CallHierarchyExporter.java | tr ':' '\n' | grep -v '/cache/jars/' | paste -sd:)
          JCHE_CP="$CP:build/classes" bash test/server/run.sh

      # maven / mavenmulti / gradle のケースも、ビルドツール無しで動く（ビルドファイルを読むだけ）
      - name: Regression test (test/demo, test/maven-demo, test/maven-multi, test/gradle-demo)
        run: bash test/regression/run.sh

  # Windows でラッパーを実際に動かす。ラッパーの分岐はほとんどが Windows 固有
  # （javac.exe、パスの \、cmd の遅延展開、powershell への委譲）で、ubuntu 側では
  # 一行も通らない。test\regression\run.cmd は今まで CI で動かしていなかった。
  # ~/.jbang のキャッシュは使わない。毎回まっさらな状態から取得させて、
  # ブートストラップ経路そのものを検査対象に含めるため。
  regression-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Regression test (Windows, jbangw\jbang.cmd)
        shell: cmd
        run: test\regression\run.cmd

      # 失敗したときに実際の出力を持ち帰れるようにする。Windows と Linux で
      # 出力が食い違ったとき、ログの差分だけでは追いきれないため
      - name: Upload output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-output-windows
          path: |
            test/regression/*/output/
            test/regression/*/run-*.log
            test/regression/run-*.log
          if-no-files-found: warn

      # jbangw\jbang.cmd が jbang 本体の終了コードを呼び出し元へ返すかを見る。返せるのは
      # 委譲を exit /b !ERRORLEVEL! で書いたときで、%ERRORLEVEL% だと括弧ブロックの
      # 解析時に展開されて常に 0 になり、run.cmd の "if errorlevel 1" が失敗を検知できない。
      #
      # 現在の jbangw/ は本家 main そのままで、この修正はコミット 314c140（本家から取り直し）
      # で巻き戻っている。つまりこの検査は今は通らない。ジョブ全体を赤にし続けると本当の
      # 失敗に気づけなくなるので、continue-on-error で警告にとどめて結果はログに残す。
      # 修正を当て直したら continue-on-error を外し、ふたたび失敗として扱うこと
      # （背景は jbangw/README.md）
      - name: jbang.cmd propagates a failing exit code (known to fail; see jbangw/README.md)
        shell: cmd
        continue-on-error: true
        run: |
          call jbangw\jbang.cmd run no-such-file-should-not-exist.java
          if errorlevel 1 (
            echo OK: non-zero exit code was propagated
            exit /b 0
          ) else (
            echo FAIL: a failing run reported success
            exit /b 1
          )

  # 同梱した JBang ラッパー（jbangw/）の検査。ファイルの中身を読むだけなので
  # JDK も jbang も要らず、数秒で終わる。
  # regression とは別ジョブにしてあるのは ~/.jbang を巻き込まないため。regression 側は
  # ~/.jbang を actions/cache で保存するので、そこへ書き込むものを同じジョブに置くと
  # 壊れた状態がキャッシュに残る。このジョブはキャッシュを使わない。
  jbangw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JBang wrapper check
        run: bash test/jbangw/run.sh

  # Eclipse（Pleiades）用の pom.xml の検査。
  # 1) //DEPS 行と pom.xml の依存が同じ版であること（ファイルを読むだけ、数秒）
  # 2) その pom.xml で実際に依存が解決でき、ソースがコンパイルできること
  #    （Eclipse の m2e がやることと同じ解決を Maven で再現する。JDK は pom の release と同じ 17）
  # regression ジョブとは別ジョブにしてあるのは、~/.m2 のキャッシュキーを jbang のものと混ぜないため。
  pom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: DEPS / pom.xml consistency check
        run: bash test/pom/run.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile with Maven
        run: mvn -B --no-transfer-progress compile

  # Eclipse プラグイン（eclipse-plugin/）の検査。
  # 1) 版・ID・クラスの実在、解析本体がバンドルのクラスパスに混ざっていないこと（ファイルを読むだけ）
  # 2) 古い Eclipse（4.6 相当）の jar と --release 8 でプラグインがコンパイルできること。
  #    本番のビルドは新しい jar を使うので、この検査だけが「古い Eclipse でも動く」を守る
  # 3) 子プロセスとのやりとり（クライアント層）が実際に動くこと
  # 4) バンドル jar が組み立てられること（解析本体は release 17、プラグインは release 8）
  eclipse-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Plugin definition consistency check
        run: bash test/plugin/run.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Old-Eclipse / Java 8 compatibility check
        run: bash test/plugin-api/run.sh

      - name: Build the bundle jar
        run: mvn -B --no-transfer-progress -f eclipse-plugin/pom.xml package

      - name: Plugin client test
        run: bash test/plugin-client/run.sh
