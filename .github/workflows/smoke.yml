name: smoke

on:
  push:
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # ツール自身は //JAVA 25 で動く。期待出力も同じ JDK で作る
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # ラッパー（jbangw/jbang）は jbang 本体を ~/.jbang に、依存 jar を ~/.m2 に置く
      - name: Cache jbang and dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.jbang
            ~/.m2/repository
          key: jbang-${{ hashFiles('jbangw/jbang', 'src/CallHierarchyExporter.java') }}

      # jbang が解決した JDT の jar を classpath にして、全ソースを警告ゼロでコンパイルできることを確認する。
      # jbang 自身がビルドしたスクリプトの jar（~/.jbang/cache/jars）は除く。残すと javac がそちらの class を使い、
      # ソースの一部が lint 対象から外れる。
      - name: Compile with all lint warnings as errors
        run: |
          CP=$(bash jbangw/jbang info classpath src/CallHierarchyExporter.java | tr ':' '\n' | grep -v '/cache/jars/' | paste -sd:)
          javac --release 17 -Xlint:all -Werror -Xdoclint:all,-missing \
                -cp "$CP" -d build/classes -encoding UTF-8 $(find src -name '*.java')

      # maven / mavenmulti / gradle のケースも、ビルドツール無しで動く（ビルドファイルを読むだけ）
      - name: Regression test (test/demo, test/maven-demo, test/maven-multi, test/gradle-demo)
        run: bash test/regression/run.sh

      # 起動コマンド（java-call-hierarchy-exporter.sh）と対話モード（src/Jche.java）。メニューへの答えをパイプで流し込んで動かす。
      # 標準入力が端末でないので、初回の「置き場所を選ぶ」問いは出ず、~/.jbang（上のキャッシュ）をそのまま使う
      - name: CLI test (java-call-hierarchy-exporter.sh launcher and interactive mode)
        run: bash test/cli/run.sh

  # Windows でラッパーを実際に動かす。ラッパーの分岐はほとんどが Windows 固有
  # （javac.exe、パスの \、cmd の遅延展開、powershell への委譲）で、ubuntu 側では
  # 一行も通らない。test\regression\run.cmd は今まで CI で動かしていなかった。
  # ~/.jbang のキャッシュは使わない。毎回まっさらな状態から取得させて、
  # ブートストラップ経路そのものを検査対象に含めるため。
  regression-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Regression test (Windows, jbangw\jbang.cmd)
        shell: cmd
        run: test\regression\run.cmd

      # 起動コマンド java-call-hierarchy-exporter.cmd。ラッパーと同じく分岐のほとんどが Windows 固有（%~dp0、for /f、遅延展開の回避、
      # timeout による端末判定）なので、ここで実際に動かす。標準入力が端末でないので初回の問いは出ない。
      # 1) 対話なし: 引数の設定ファイルを解析して出力フォルダができること
      # 2) 対話モード: メニューの答え（4 = 状態表示, Enter, q）をパイプで流し込み、状態表示の行が出ること
      #    launcher.properties にヒープ上限を書いておき、-R で JVM に渡ったこと（ヒープ上限の表示）も見る
      - name: Launcher test (Windows, java-call-hierarchy-exporter.cmd)
        shell: cmd
        run: |
          if exist test\regression\entry\output rmdir /s /q test\regression\entry\output
          call java-call-hierarchy-exporter.cmd test\regression\entry\config.properties > launcher-batch.log 2>&1
          type launcher-batch.log
          rem 出力フォルダ名は <日時>_demo で実行のたびに変わる。cmd の if exist はワイルドカードを
          rem 「最後のファイル名」の位置でしか解釈しないので、途中のフォルダ名に * を書いた条件は常に偽になる。
          rem フォルダは for /d で走査して、その中の CSV を if exist で見る
          set "FOUND="
          for /d %%D in (test\regression\entry\output\*_demo) do if exist "%%D\call-hierarchy.csv" set "FOUND=1"
          if not defined FOUND (echo FAIL: no output folder & exit /b 1)
          > launcher.properties (
            echo JBANG_DIR=
            echo JBANG_REPO=
            echo JCHE_JAVA_OPTS=-Xmx640m
            echo JCHE_JBANG_OPTS=
          )
          (echo 4& echo.& echo q) | call java-call-hierarchy-exporter.cmd > launcher-status.log 2>&1
          type launcher-status.log
          findstr /c:"java.home" launcher-status.log > nul || (echo FAIL: status screen missing & exit /b 1)
          findstr /c:"640 MB" launcher-status.log > nul || (echo FAIL: JCHE_JAVA_OPTS not applied & exit /b 1)
          del launcher.properties
          echo OK

      # 失敗したときに実際の出力を持ち帰れるようにする。Windows と Linux で
      # 出力が食い違ったとき、ログの差分だけでは追いきれないため
      - name: Upload output on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: regression-output-windows
          path: |
            test/regression/*/output/
            test/regression/*/run-*.log
            test/regression/run-*.log
          if-no-files-found: warn

      # jbangw\jbang.cmd が jbang 本体の終了コードを呼び出し元へ返すかを見る。返せるのは
      # 委譲を exit /b !ERRORLEVEL! で書いたときで、%ERRORLEVEL% だと括弧ブロックの
      # 解析時に展開されて常に 0 になり、run.cmd の "if errorlevel 1" が失敗を検知できない。
      #
      # 現在の jbangw/ は本家 main そのままで、この修正はコミット 314c140（本家から取り直し）
      # で巻き戻っている。つまりこの検査は今は通らない。ジョブ全体を赤にし続けると本当の
      # 失敗に気づけなくなるので、continue-on-error で警告にとどめて結果はログに残す。
      # 修正を当て直したら continue-on-error を外し、ふたたび失敗として扱うこと
      # （背景は jbangw/README.md）
      - name: jbang.cmd propagates a failing exit code (known to fail; see jbangw/README.md)
        shell: cmd
        continue-on-error: true
        run: |
          call jbangw\jbang.cmd run no-such-file-should-not-exist.java
          if errorlevel 1 (
            echo OK: non-zero exit code was propagated
            exit /b 0
          ) else (
            echo FAIL: a failing run reported success
            exit /b 1
          )

  # action.yml（GitHub Actions から使うための複合アクション）を、このリポジトリ自身で動かす。
  # 利用者のワークフローが通る経路そのものなので、設定ファイルを生成する経路（入力から作る）と
  # 用意した設定ファイルを渡す経路の両方を通し、アクションの出力（csv / methods-csv / output-dirs）が
  # 実在するファイルを指すことまで見る。
  # ~/.jbang のキャッシュはアクション自身が持つ（cache 入力）ので、ここでは actions/cache を書かない
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 入力から設定ファイルを生成する経路。JDK の用意も JBang の取得もアクションの中で行う
      - name: Export call hierarchy (generated config)
        id: generated
        uses: ./
        with:
          project-root: test/demo
          source-folders: src
          source-encoding: UTF-8
          external-library-folders: extjars
          upload-artifact: 'false'

      # アクションの出力は env 経由で渡す（run: の中に ${{ }} を直接書かない書き方）
      - name: Check outputs (generated config)
        env:
          OUTPUT_DIR: ${{ steps.generated.outputs.output-dir }}
          CSV: ${{ steps.generated.outputs.csv }}
          METHODS_CSV: ${{ steps.generated.outputs.methods-csv }}
          RUN_LOG: ${{ steps.generated.outputs.run-log }}
        run: |
          test -s "$CSV"
          test -s "$METHODS_CSV"
          test -s "$RUN_LOG"
          # 生成した設定ファイルの複製が出力フォルダに入っていること
          test -f "$OUTPUT_DIR/config.properties"
          head -1 "$CSV"

      # 用意した設定ファイルを渡す経路。複数渡せること（出力フォルダが 2 つ）と、
      # java-version を空にすると JDK のセットアップを飛ばすこと（前のステップの JDK を使う）も通す
      - name: Export call hierarchy (existing config files)
        id: existing
        uses: ./
        with:
          config: |
            test/regression/whole/config.properties
            test/regression/entry/config.properties
          java-version: ''
          cache: 'false'
          artifact-name: call-hierarchy-regression-configs

      - name: Check outputs (existing config files)
        env:
          OUTPUT_DIRS: ${{ steps.existing.outputs.output-dirs }}
          CSV: ${{ steps.existing.outputs.csv }}
        run: |
          # 設定ファイル 2 つぶんの出力フォルダが並ぶ
          test "$(printf '%s\n' "$OUTPUT_DIRS" | grep -c .)" = 2
          test -s "$CSV"

  # 同梱した JBang ラッパー（jbangw/）の検査。ファイルの中身を読むだけなので
  # JDK も jbang も要らず、数秒で終わる。
  # regression とは別ジョブにしてあるのは ~/.jbang を巻き込まないため。regression 側は
  # ~/.jbang を actions/cache で保存するので、そこへ書き込むものを同じジョブに置くと
  # 壊れた状態がキャッシュに残る。このジョブはキャッシュを使わない。
  jbangw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: JBang wrapper check
        run: bash test/jbangw/run.sh

  # Eclipse（Pleiades）用の pom.xml の検査。
  # 1) //DEPS 行と pom.xml の依存が同じ版であること（ファイルを読むだけ、数秒）
  # 2) その pom.xml で実際に依存が解決でき、ソースがコンパイルできること
  #    （Eclipse の m2e がやることと同じ解決を Maven で再現する。JDK は pom の release と同じ 17）
  # regression ジョブとは別ジョブにしてあるのは、~/.m2 のキャッシュキーを jbang のものと混ぜないため。
  pom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: DEPS / pom.xml consistency check
        run: bash test/pom/run.sh

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile with Maven
        run: mvn -B --no-transfer-progress compile
