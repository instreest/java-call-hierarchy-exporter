# =====================================================================
# 相対パスの起点
#   project.root / cache.folders / output.csv / methods.csv
#     … この「設定ファイル」が置かれているディレクトリ
#   source.folders / library.folders / external.library.folders … project.root
# パス区切りを\マークで指定する場合は\\マークに置き換えが必要
# =====================================================================

# --- 解析対象 -------------------------------------------------------
# 解析対象プロジェクトのルートを指定する
project.root=../../java-call-hierarchy-exporter

# ソースフォルダ（project.root からの相対パス指定、カンマ区切り）
# 空欄で project.root に Eclipseの .classpath があれば、その kind="src" を使う
source.folders=./src

# 依存jarを集めたフォルダ（project.root からの相対パス指定、カンマ区切り）
# フォルダを指定すると直下（サブフォルダは見ない）の *.jar を全部使う。jar単体でも可。
#
# ここが不足していると型解決に失敗し、その呼び出しが call-hierarchy.csv から
# 丸ごと抜け落ちる。失敗件数は実行ログに出るので、多い場合はここを見直すこと。
# GradleやMavenをEclipse連携で使っているプロジェクトは .classpath に依存jarの
# 実体が書かれていない（kind="con" というコンテナ参照のみ）ため、
# 依存jarを1か所に集めたフォルダをここに指定する必要がある。
#
# この同梱設定（自己解析）では ./lib を指す。jbangw で一度実行した後に
#   find .jbang/repository -name "*.jar" -exec cp {} lib/ \;
# で作れる（README「Pleiades/Eclipse環境」参照。.jbang/repository はMaven形式で
# 入れ子のため、ここに直接指定しても直下しか見ない仕様上、拾われない）。
library.folders=./lib

# 解析対象ソースの文字コード（[UTF-8]、MS932※MS932はWindowsでのSJIS指定）
source.encoding=MS932

# 解析対象ソースのJavaバージョン（JDTのコンパイラ準拠レベル）
#
# 通常は空欄でよい。空欄なら、クラスパスに入っているJDTが対応する最大値を使う。
# 新しい言語機能を許可するだけなので、対象コードが実際にそれを使うかどうかには
# 影響しない。実際に使われた値は起動時のログに出る。
#
# 指定が要るのは、新しい版では意味が変わる書き方を含む古いコードを解析するとき
# （var / record / sealed / yield などが識別子として使われている場合）。
#   例) 1.8, 11, 17, 21
#
# 指定した値がJDTの対応範囲外なら起動時にエラーになる。
# 新しいJDTは 1.7 以下の指定を黙って 1.8 に引き上げるため、その場合はログに出る。
# それより古いレベルが必要なら、古い版のJDTを使うこと。
#
# この値を変えるとキャッシュは破棄される（同じソースでも、どの言語バージョンと
# して解析したかで結果が変わるため）。
source.level=

# --- エントリポイント（複数指定可・カンマ区切り） -----------------------
# call-hierarchy.csv の出力時の起点を指定する。
# entry.packages を空にすると「呼び出し元が無いメソッド」を自動的に起点にする。
#   jp.co.xxx.action.*                  … そのパッケージ直下のクラス全部
#   jp.co.xxx.action.**                 … そのパッケージ配下（サブパッケージ含む）全部
#   jp.co.xxx.action.UserAction         … クラス指定
#   jp.co.xxx.action.UserAction#execute … メソッド指定
entry.packages=

# --- 出力から除外するパッケージ（書式は entry.packages と同じ） -----------
# call-hierarchy.csv の出力から除外する呼び出し先を指定する。
# 除外対象のメソッドは出力しないが、その先に対象のメソッドがある場合は
# 呼び出し階層として親に繋ぎ直して出力する。
exclude.packages=\
    java.**,\
    javax.**,\

# --- 探索の安全策 ---------------------------------------------------
# 最大呼び出し階層の上限（0以下で無制限。ただし探索は再帰のため実効上限は512）
max.depth=50

# 出力行数の上限（0以下で無制限）。上限に達すると打ち切り、ログに警告を出す
max.rows=5000000

# --- キャッシュ -----------------------------------------------------
# AST解析結果のインデックスキャッシュを保存し、再出力時に解析をスキップする。
# 差分判定は「最終更新時刻」と「ファイルサイズ」の両方が一致するかで行う。
# バージョン管理がタイムスタンプを復元する設定だと検出漏れの可能性があるため、
# 疑わしいときは false にするかキャッシュファイルを削除すること。
cache.enabled=true
cache.folders=./.cache

# --- 具象クラスの解決（CHA） ---------------------------------------
# インターフェース型の呼び出しを、どの実装に解決したかを段階的に判定する。
# 先に確定した段で打ち切る。解決した場合は call-hierarchy.csv の
# call-hierarchy 列の最後に「解決:ラベル」として出る。
#   段0 STATIC_BOUND … private/static/final、finalクラス、コンストラクタ、super呼び出し
#   段1 NO_OVERRIDE  … オーバーライドしている型が無い
#       SINGLE_IMPL  … 候補が1つだけ（IFに実装が1つ等）
#   段2 LOCAL_NEW    … 同一メソッド内で new された型
#   段4 DATAFLOW_NEW     … new された具象型から特定（下記のデータフロー解析）
#      DATAFLOW_FACTORY  … ファクトリメソッドの戻り値から特定（同上）
#      DATAFLOW_PARAM    … 呼び出し元から渡された引数から特定（同上）
#      DATAFLOW_FIELD    … コンストラクタ注入されたフィールドから特定（同上）
#   段5 CHA          … 候補が複数（低確度）。候補は列挙するがその先へは降りない

# --- データフロー解析 -------------------------------------------------
# CHAで候補が複数になった呼び出しについて、値の流れを追って具象クラスを1つに絞る。
#   ・ファクトリメソッドの戻り値  DaoFactory.createUser().select()
#     （クラス名の文字列を受け取って Class.forName(...).newInstance() する形も可）
#   ・呼び出し元から渡された引数  useDao(new UserDao()) -> void useDao(Dao dao)
#   ・コンストラクタ注入されたフィールド  new Service(new UserDao()).exec()
#   ・匿名クラス/ローカルクラスが捕捉した変数（final・実質的finalなので値が変わらない）
#
# 引数とフィールドの追跡は「起点からの経路」ごとに行う。同じメソッドでも、
# 別の起点から別の具象クラスを渡されていればそちらはそちらで判定される。
#
# 絞れない場合（複数の型を返すファクトリ、実行時に決まるクラス名、再代入される
# ローカル変数、setterやDI設定で入るフィールド、起点メソッドの引数）は、
# 絞らずに CHA候補のまま出力する。
# 「1つに絞ったが実は違った」は調査対象の取りこぼしになるため。
#
# 具象クラスが1つに定まると探索の枝分かれが減るので、通常は出力行数も所要時間も
# 減る。想定外に遅い場合は false にして切り分けること。
dataflow.enabled=true

# ファクトリの委譲（return create(); のように別のファクトリへ委譲する形）を
# 何段まで辿るか
dataflow.max.depth=5

# --- 被参照スキャン -----------------------
# 自分のコードを呼んでいる側のjarを指定する
# （project.root からの相対パス指定、カンマ区切り。ファイルでもディレクトリでも可）。
# classファイルの定数プールだけを読むため、「どのjar・どのクラスが参照しているか」までが分かる。
# 結果は call-hierarchy.csv に追記される（呼び出し階層の行とは列の詰め方が異なる）。
#
# 自プロジェクトのクラスを含むjar（自分のビルド成果物が同じフォルダにある等）は
# 「他リポジトリからの被参照」ではないので読み飛ばす。除外件数は実行ログに出る。
external.library.folders=

# --- 出力 -----------------------------------------------------------
# 出力ファイルの文字コード。UTF-8-BOM（BOM付きUTF-8）
# MS932 も指定可。変換できない文字は '?' に置換される（例外にはしない）
output.encoding=UTF-8-BOM

# 出力先：呼び出し階層リスト
# 呼び出し階層のほか、型解決に失敗した呼び出しと被参照スキャンの結果も
# このファイルに出力される（root 列で区別できる）。
# なお、コンストラクタの呼び出しそのものは行にしない
# （その中からの呼び出しは、経路にコンストラクタを含めて出力される）。
# コンストラクタの表示名は <init> ではなくクラス名。暗黙のデフォルト
# コンストラクタも、補完される名前（＝クラス名）で出る。
# ただし caller 列だけはEclipseのスタックトレース形式に合わせて <init> のまま。
output.csv=./output/call-hierarchy.csv

# 出力先：メソッドリスト（ソース上の全メソッドとその呼び出し状況）
# コンストラクタは call-hierarchy.csv と揃えて出力しない。
# unresolvedCalls / unresolvedCause 列に「具象クラスを1つに絞れなかった
# 呼び出しの件数とその理由」が出るので、階層を追う前に穴の場所が分かる。
methods.csv=./output/methods.csv
