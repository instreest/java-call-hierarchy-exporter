# 既定の設定ファイル。引数を省略すると、作業ディレクトリの config/config.properties が読まれる。
# 設定ファイルは引数に複数渡せる（順に処理する。1つが失敗しても残りは続け、最後にまとめて報告する）。
#   ./jbangw/jbang src/jche/CallHierarchyExporter.java config/projA.properties config/projB.properties
#
# 相対パスの起点は項目ごとに異なる（各項目のコメント参照）。
#   project.root / output.folder / cache.folder … この設定ファイルのフォルダ
#   source.folders / library.folders / external.library.folders … project.root
# 相対パスは起点フォルダの配下だけ指定できる（.. で外へ出る指定はエラー。外を指すときは絶対パス）。
# project.root だけは起点そのものなので、この制限は無い。

# --- 解析対象 -------------------------------------------------------
# 必須なのは project.root だけ。他の項目は空欄のままなら project.root の中身から決める
#   source.folders   … .classpath の kind="src"、無ければ src/main/java → src → <モジュール>/src/main/java
#   library.folders  … pom.xml / build.gradle から自動取得、無ければ project.root 直下の lib の *.jar
#   source.encoding  … pom.xml の project.build.sourceEncoding、無ければ UTF-8
# 解析対象プロジェクトのルートを指定する（この設定ファイルのフォルダからの相対パス、または絶対パス）。
# このフォルダ名が出力フォルダ名とキャッシュフォルダ名の「プロジェクト名」になる。
project.root=../../java-call-hierarchy-exporter

# ソースフォルダ（project.root からの相対パス指定、カンマ区切り）
# 絶対パスで書く場合も project.root の配下でなければならない
# 空欄にすると、project.root の .classpath（kind="src"）、無ければ src/main/java → src →
# 各モジュールの src/main/java の順に見つかったものを使う。
source.folders=

# 依存jarを集めたフォルダ（project.root からの相対パス指定、カンマ区切り）
# フォルダを指定すると直下（サブフォルダは見ない）の *.jar を全部使う。
# jar を足したり差し替えたり外したりすると、次回の実行でその jar のパッケージを参照している
# ファイルと型解決に失敗していたファイルだけが解析し直される（キャッシュは丸ごと捨てない）。
#
# 空欄にすると、Maven / Gradle プロジェクトでは依存jarを自動で集める（ビルドツールは実行しない）。
# 各ソースフォルダの上位（project.root まで）にある pom.xml / build.gradle(.kts) をこのツールが読み、
# 依存の jar と POM をローカルリポジトリ（下記 library.repositories）から探す。推移的な依存は
# ローカルにある POM を辿って集める。ネットワークには出ない（無い jar は警告して、無いまま解析する）。
# jar はローカルリポジトリに置かれたままのパスで使い、コピーしない。
# マルチモジュールの兄弟モジュールは、その target/classes（Gradle は build/classes や Buildship の bin/main）と
# そのビルドファイルの依存で解決する（mvn install は要らない）。
# Gradle のビルドファイルはプログラムなので、読めるのは宣言的な書き方だけ
# （'g:a:v'、group:/name:/version:、$var、版カタログ libs.x.y、platform()、project(':x')、files()）。
# gradle.lockfile があればそれを使う。
# 指定がある場合は自動取得しない。pom.xml / build.gradle が無く .classpath にも jar が無い場合は、
# project.root 直下の lib に *.jar があればそれを使う。
library.folders=

# 依存jarを1件ずつ指定する（カンマ区切り、任意）。library.folders でフォルダごと指定できない構成のための逃げ道。
# 置き場所の制限は無い（~/.m2 の下など、プロジェクトの外を指してよい）。~ はホームに展開する。
# Eclipseプラグインは、プロジェクトの解決済みクラスパスをこの形で渡す。
# library.folders と library.jars がどちらも空欄のときだけ、pom.xml / build.gradle からの自動取得が働く。
library.jars=

# library.folders が空欄のときに読むビルドファイルの種類。通常は auto でよい。
#   auto   … pom.xml があれば Maven、build.gradle / settings.gradle があれば Gradle。両方あるときは
#            Eclipse の .project / .classpath でどちらとして開かれているかを見て、それも無ければ Maven
#   maven / gradle … 検出結果に関係なくそのツールのビルドファイルを読む
#   none   … 自動取得しない（library.folders も空欄のまま依存jar無しで解析する）
library.build.tool=auto

# ローカルリポジトリ（ダウンロード済みの jar と POM の置き場所。カンマ区切り）。
# 空欄なら Maven の ~/.m2/repository（~/.m2/settings.xml の localRepository があればそこ）と
# Gradle の ~/.gradle/caches/modules-2/files-2.1（GRADLE_USER_HOME があればその下）のうち存在するもの。
# Eclipse の m2e / Buildship が依存を取得した場所も同じ。別の場所にある場合や、jar を集めた
# Maven 形式のフォルダを使う場合はここに書く。相対パスはこの設定ファイルのフォルダ起点（外を指してもよい）。
# 先頭の ~/ はホームフォルダ。
library.repositories=

# 解析対象ソースの文字コード（UTF-8、MS932※MS932はWindowsでのSJIS指定）
# 空欄にすると pom.xml の project.build.sourceEncoding、無ければ UTF-8。
source.encoding=

# 外部jarファイルからの自分のコードを呼んでいる側のjarを指定する
# （project.root からの相対パス指定、カンマ区切り。ファイルでもディレクトリでも可）。
# ディレクトリはサブフォルダも含めて *.jar / *.war / *.ear を全部使う。
# FatJar（Spring Boot の BOOT-INF/lib/*.jar、war の WEB-INF/lib/*.jar、ear の中の war 等）は
# 中の jar まで開いて走査する。出力の jar 名は「外側.jar!/BOOT-INF/lib/中.jar」の形になる。
# 外部jarに自jarがある場合（FatJar の中に入っている場合も）は調査対象から除外して読み飛ばす。
# 除外件数は進捗ログに出る。
external.library.folders=

# 解析対象ソースのJavaバージョン（JDTのコンパイラ準拠レベル）
#
# 通常は空欄でよい。空欄なら、クラスパスに入っているJDTが対応する最大値を使う。
# 新しい言語機能を許可するだけなので、対象コードが実際にそれを使うかどうかには
# 影響しない。実際に使われた値は起動時のログに出る。
source.level=

# --- エントリポイント（複数指定可・カンマ区切り） -----------------------
# call-hierarchy.csv の出力時の起点を指定する。
# entry.packages を空にすると「呼び出し元が無いメソッド」を自動的に起点にする。
#   jp.co.xxx.action.*                  … そのパッケージ直下のクラス全部
#   jp.co.xxx.action.**                 … そのパッケージ配下（サブパッケージ含む）全部
#   jp.co.xxx.action.UserAction         … クラス指定
#   jp.co.xxx.action.UserAction#execute … メソッド指定
entry.packages=

# --- 出力から除外するパッケージ（書式は entry.packages と同じ） -----------
# call-hierarchy.csv の出力から除外する呼び出し先を指定する。
# 除外対象のメソッドは出力しないが、その先に対象のメソッドがある場合は
# 呼び出し階層として親に繋ぎ直して出力する。
# 判定は「解決後の具象クラス」で行うので、宣言型が java.** でも具象が自分のソースなら出力する
# （Runnable r = new MyTask(); r.run(); は MyTask.run として出る）。
# 逆に具象を1つも絞れなかった呼び出しは宣言型のまま除外され、そのぶん実装側の入次数が0になって
# 起点に昇格することがある（docs/excluded-entry-promotion-qa.md）。
exclude.packages=\
    java.**,\
    javax.**,\

# --- キャッシュ -----------------------------------------------------
# AST解析結果のインデックスキャッシュを保存し、再出力時に解析をスキップする。
# 差分判定は「パス」「ファイルサイズ」「内容のハッシュ」で行う。最終更新時刻は見ない。
# 更新時刻は中身と関係なく変わる（git のチェックアウト、コピー、CI のたびに作り直される
# ワークスペース）ので、当てにすると中身が同じでも解析し直してしまう。逆にバージョン管理が
# タイムスタンプを復元する設定だと、中身が違うのに再利用してしまう。どちらも内容で見れば起きない。
# 変更されたファイルが宣言する型を参照しているファイルも、解決結果が変わりうるので解析し直す
# （例: 呼び出し先のクラスを変更すると、それを呼んでいるクラスも再解析される）。
# コンパイル時定数（static final の値・注釈の既定値）は使う側に値が焼き込まれるため、
# 値が変わった場合だけ、その定数を使っているファイルまで連鎖して解析し直す。
# ソースレベル・ソースの文字コード・実行 JDK・キャッシュの形式が前回と違う場合と、
# キャッシュが途中で切れている場合は、丸ごと捨てて全件解析し直す（理由はログに出る）。
# 解析の途中で実行を止めた場合は、そこまでに解析したぶんを次回に引き継ぐ
# （ソース一覧と依存jarが当時と同じときだけ。引き継いだ件数はログに出る）。
# 依存jar（クラスパス）も同じ考え方で、中に入っているクラスの一覧から作った指紋で見る。
cache.enabled=true

# キャッシュの置き場所。出力フォルダには置かず、解析対象プロジェクトごとのサイドカーとして
# このツールのプロジェクトフォルダ（src/jche/CallHierarchyExporter.java のあるフォルダ）の .cache/ の下に
#   .cache/<project.root のフォルダ名>_<project.root の絶対パスのハッシュ8桁>/
# の形で作る。中には 2 つのファイルができ、常に対で作られる（片方だけ消しても両方作り直される）。
#   analysis-cache.tsv … 呼び出し階層を出すための事実
#   dataflow-cache.tsv … 呼び出し階層には使わない、値の追跡のための事実
# 同じプロジェクトを指す設定ファイルが複数あれば同じキャッシュを共有し、
# 名前が同じでも場所が違うプロジェクトは混ざらない。
# 通常は空欄でよい。指定すると、そのフォルダの下に同じ形のプロジェクト別フォルダを作る
# （この設定ファイルのフォルダからの相対パス、または絶対パス）。
cache.folder=

# --- 探索の安全策 ---------------------------------------------------
# 最大呼び出し階層の上限（0以下で無制限。ただし探索は再帰のため実効上限は512）
# 数値項目は空欄なら既定値
max.depth=50

# 出力行数の上限（0以下で無制限）。上限に達すると打ち切り、ログに警告を出す
max.rows=5000000

# 具象クラスが1つに定まると探索の枝分かれが減るので、通常は出力行数も所要時間も
# 減る。想定外に遅い場合は false にして切り分ける。
# リフレクション（Class.forName / getMethod / Method.invoke / newInstance）の解決もこの設定に従う。
#
# false にすると dataflow-cache.tsv（値を持つ側のキャッシュ）を開かない。
# 具象クラスの解決は CHA まで、条件分岐の打ち切り（branch.pruning.enabled）は起きない。
# 型階層と注解は analysis-cache.tsv 側にあるので、CHA と Spring の DI による絞り込みは効く。
# キャッシュは 2 つとも書かれる（読まないだけ）。
dataflow.enabled=true

# 経路に依存する探索（呼び出し元から引数で渡ってきたクラス名の文字列やクラスリテラルを、
# リフレクションの解決のために辿る）を何段まで辿るか。
# ファクトリの委譲（return create(); のように別のファクトリへ委譲する形）はこの値によらず
# 段数の上限なく畳む（循環している委譲は「決められない」として扱う）
dataflow.max.depth=5

# DI コンテナ（Spring）の Bean 定義で具象クラスの候補を絞るか。
# @Autowired などで注入されたインスタンスは宣言型がインターフェースのため CHA では
# 絞れないが、コンテナが注入するのは Bean として登録された型だけなので、候補のうち
# Bean が1つだけならその実装に確定できる（出力の注記は [RESOLVED:SPRING_DI]）。
# 詳しくは README の「Spring による DI の解決」を参照
spring.di.enabled=true

# 追加で Bean 登録の印とみなす注釈（カンマ区切り。FQN でも単純名でもよい）。
# 既定では @Component / @Service / @Repository / @Controller / @RestController /
# @Configuration / @ControllerAdvice / @RestControllerAdvice と、JSR-330 の
# @Named / @ManagedBean / @Singleton を印とみなす。@Service を合成した独自の注釈を
# 使っているなら、その名前をここに足す
# 例: spring.di.bean.annotations=jp.co.xxx.MyDomainService,MyBatisMapper
spring.di.bean.annotations=

# --- インスタンス解析条件のプラグイン（既定は使わない） -------------------
# DI 設定ファイルやファクトリメソッドのように、ソースを読むだけでは具象クラスが決まらない
# 呼び出しに、外から解決の条件を与える。指定が無ければ何も読み込まないので、
# 使わないなら以下は空欄のままでよい（既定の解析は何も変わらない）。
#
# 解決は2つの段階に分かれている。
#   フェーズA（抽出時）… ソースを読みながら、呼び出し箇所の手がかりを拾う
#                        例) DaoFactory.get("USER_DAO") の "USER_DAO"
#   フェーズB（構築時）… 手がかりと宣言型から具象クラスを決める
#                        例) "USER_DAO" -> jp.co.xxx.dao.UserDaoImpl
# 対応表を書けば済む用途のために、両方の実装を同梱してある（Java を書く必要は無い）。
#
# 【使い方1】同梱の実装を使う（対応表を書くだけ）
#   resolver.hint.collectors=jche.builtin.FactoryKeyCollector
#   plugin.factory.methods=jp.co.xxx.DaoFactory#get, jp.co.xxx.ServiceLocator#lookup
#   resolver.candidate.providers=jche.builtin.TypeMappingProvider
#   plugin.mapping.files=mapping.properties
#
#   mapping.properties（この設定ファイルからの相対パス。UTF-8 の properties 形式）:
#     # 宣言型 -> 具象型（DI 設定から機械的に書き出せる形）
#     jp.co.xxx.dao.UserDao = jp.co.xxx.dao.UserDaoImpl
#     # 宣言型#メソッド -> 具象型
#     jp.co.xxx.dao.UserDao#find = jp.co.xxx.dao.CachedUserDao
#     # 手がかり -> 具象型（区切りは @。properties では : と = が使えないため）
#     FACTORY_KEY@USER_DAO = jp.co.xxx.dao.UserDaoImpl
#   値はカンマ区切りで複数書ける（候補が絞り切れない場合）。
#
# 【使い方2】自分で書く（設定ファイルの形式が独自、条件が複雑な場合）
#   plugin.folders に .java を置くだけでよい。実行時にコンパイルされるので、
#   Maven や Gradle でのビルドは要らない（.class や .jar を置いてもよい）。
#   実装するインターフェースは jche.extension.CallSiteHintCollector（フェーズA）と
#   jche.extension.TypeCandidateProvider（フェーズB）。書き方は
#   docs/instance-analysis-plugin-qa.md と test/regression/plugin/ の例を参照。
#     plugin.folders=plugins
#     resolver.candidate.providers=jp.co.xxx.MyProvider
#
# 拡張クラスの置き場所（この設定ファイルのフォルダからの相対パス、カンマ区切り）。
# サブフォルダも見る。同梱の実装（jche.builtin.*）を使うだけなら空欄でよい
plugin.folders=

# 読み込む拡張クラスのFQN（カンマ区切り）。書いた順に尋ね、最初に候補を返したものを採用する
resolver.hint.collectors=
resolver.candidate.providers=

# --- ソースの外（JDK・フレームワーク）との契約 ---------------------------
# ツールは jar の中を読まないが、「jar の中のこのメソッドは渡した値のこれを呼び戻す」
# 「フレームワークはこのメソッドを入口として呼ぶ」という契約は表で書ける
# （docs/callback-contracts.md）。JDK・Servlet・Spring・JUnit 等の分は同梱してある。
#
# 自前のフレームワーク分を足すときは、契約表のファイル（UTF-8、1 行 1 契約）を置いて
# ここに書く（この設定ファイルのフォルダからの相対パス、カンマ区切り）。
#   contracts.files=contracts.txt
#
#   contracts.txt:
#     # 呼び戻し: 呼び出し先のメソッドキー -> 位置 : 呼び戻されるシグネチャ
#     #   位置は r（レシーバ）/ aN（N番目の実引数）/ cN（レシーバの new のN番目の実引数）。* で全部
#     jp.co.xxx.Dispatcher#submit(java.lang.Runnable) -> a0 : run()
#     # 入口: @アノテーション / super 型#シグネチャ / static シグネチャ
#     @jp.co.xxx.Endpoint
#     super jp.co.xxx.BaseAction#execute()
#
# 表で書けない条件は、jche.extension.ContractProvider を実装した拡張で返す
# （plugin.folders に置き、クラス名をここに書く。読み込み方は resolver.* と同じ）。
#   contracts.providers=jp.co.xxx.MyContracts
contracts.files=
contracts.providers=

# 同梱の契約表を使うか。false にすると自前の表と拡張だけになる
contracts.builtin=true

# --- 条件分岐による打ち切り -------------------------------------------
# 呼び出し箇所を囲む条件が「その経路では成立しない」と言い切れるとき、その呼び出しから
# 先の階層を辿らない。true=打ち切る（既定） / false=これまでどおり全部辿る。
#
#   void run(boolean debug) { if (debug) { dump(); } }   ... run(false) の経路では dump() の先を辿らない
#
# 【出力がどう変わるか】
# 1) call-hierarchy.csv … 打ち切った呼び出し自体は1行出て、末尾に注記が付く。
#      その行より先（dump() が呼ぶメソッド）が出なくなる。
#      注記の例: [UNREACHABLE] この経路では呼ばれない: 条件「debug」が成立しない（呼び出し元から渡された第1引数 = false）
# 2) methods.csv … 打ち切った先にしか無いメソッドは階層CSVから丸ごと消えるので、
#      inHierarchy=0 / absentCause=[UNREACHABLE] 条件分岐で打ち切った先 で一覧できる（行自体は消えない）。
# 3) 実行ログ … 打ち切った件数と、階層CSVに出なくなったメソッドの件数を出す。
#
# 【どんな条件を判定するか】
#   if / else / 三項演算子 ?: の枝、&& || の右側、アロー形式の switch の case / default、
#   equals による比較、プリミティブ・列挙型・文字列の == / !=
# 値が分かるのは「呼び出し元からコンパイル時定数が渡された引数」と「コンパイル時定数
# （static final の定数・列挙定数・リテラル）」だけ。メソッドの戻り値・フィールドの状態・
# null 判定など、値が分からない条件はこれまでどおりすべて辿る
# （分からないことを理由に階層を消さない、という安全側の方針）。
# コロン形式の switch、ラムダ式・匿名クラスの外側の条件、ループ条件・早期 return・例外は
# 意図的に見ない（「呼ばれない」ことの証明にならないため）。
#
# 【ほかの設定との関係】
# 経路ごとの引数の値は dataflow.enabled の仕組みで運ぶ。dataflow.enabled=false のときは
# 条件の判定材料（ガード）を持つ dataflow-cache.tsv を開かないので、
# この設定を true にしていても打ち切りは起きない。
branch.pruning.enabled=true

# --- 呼び出しに効いている条件を出す ---------------------------------
# ここに対象を書くと、通常の出力（call-hierarchy.csv / methods.csv）はそのままに、
# 追加で call-conditions.csv を書く（画面と run.log にも同じ内容を出す）。
# 解析の中身は変わらない。空欄なら call-conditions.csv を作らないだけ。
#   src/foo/Bar.java        そのファイルの呼び出し全部
#   src/foo/Bar.java:120    その行の呼び出しだけ
#   foo.Bar                 型（foo/Bar.java に読み替える）
#   foo.Bar#method          その型の method の中に書かれている呼び出しだけ
# 「その経路では呼ばれない」と判定できる条件だけでなく、判定できない条件
# （メソッドの戻り値・範囲比較・null 判定・ループ・catch・コロン形式の switch）も並べるので、
# 「なぜ打ち切られなかったのか」「実行時に何を確認すればよいのか」が分かる。
# 対象が見つからないときは警告を出すだけで、解析そのものは成功する。
# 詳しくは docs/call-conditions.md。
conditions.target=

# --- 出力 -----------------------------------------------------------
# 出力ファイルの文字コード。[UTF-8-BOM]（BOM付きUTF-8）
# MS932 も指定可。変換できない文字は '?' に置換される（例外にはしない）
output.encoding=UTF-8-BOM

# 出力先のフォルダ（この設定ファイルのフォルダからの相対パス、または絶対パス）。
# 既定は「.」＝この設定ファイルと同じフォルダ（この既定の設定ファイルなら config/）。
# 実行のたびに、この下に「解析開始日時_プロジェクト名」のフォルダを作って書く。
#   config/20260907-163000_myapp/
#     call-hierarchy.csv    … 呼び出し階層リスト
#     methods.csv           … メソッドリスト（ソース上の全メソッドとその呼び出し状況）
#     <設定ファイル名>       … この実行に使った設定ファイルの複製
#     run.log               … 標準出力と同じ内容の実行ログ（UTF-8）
#     resolved-classpath.txt … ビルドファイルから依存 jar を集めたときの一覧
# ファイル名は固定。同じ秒に同じプロジェクトを解析すると _2, _3 … が付く。
output.folder=.

# --- 表示言語 -------------------------------------------------------
# Display language for messages (screen / log). [en] or [ja]. Empty = follow the OS locale.
# 画面と実行ログの言語。[en] 英語 / [ja] 日本語。空欄なら OS の言語に従う。
# 環境変数 JCHE_LANG（またはシステムプロパティ jche.lang）のほうが強く、
# 指定されていればこの項目は無視される（CI や検査スクリプトが言語を固定するため）。
# 出力 CSV の中身は言語によらず英語で固定で、この項目では変わらない（docs/nls-qa.md）。
message.language=
