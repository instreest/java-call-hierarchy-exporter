# Default (English) texts for the Eclipse plug-in UI. See jche/eclipse/Messages.java.
#
# - This file is read as UTF-8, never as ISO-8859-1, so write plain text (no \\uXXXX escapes).
# - {0} {1} ... are replaced with values. There is no MessageFormat quoting here, so an
#   apostrophe is just an apostrophe: write "don't", not "don''t".
# - Add a key here first. A key that exists only in a translation is never used, because
#   this file is the base and the translation is layered on top of it.
# - Texts for plugin.xml (view name, menu labels) live in plugin.properties instead, because
#   those are resolved by OSGi rather than by this class.
#
# Translations: messages_<language>.properties (messages_ja.properties for Japanese).

