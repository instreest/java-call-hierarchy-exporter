# 日本語の文言。英語（messages.properties）に重ねて使う（jche/eclipse/Messages.java）。
#
# - このファイルは UTF-8 として読む（\\uXXXX に変換しなくてよい）
# - {0} {1} … は値に置き換わる
# - ここにしか無いキーは使われない。項目を足すときは英語の側から足すこと
# - plugin.xml とバンドルの名前は plugin_ja.properties にある（読む側が OSGi なので別）

# --- 共通 -----------------------------------------------------------------
dialog.title=影響調査
dialog.resetConfirm={0} の解析結果を捨てます。\n\n呼び出し階層をもう一度見るには解析し直しが要ります。ディスクのキャッシュは残るので、初回より速く終わります。キャッシュのファイルごと消すときは、設定画面の［解析キャッシュを削除］を使ってください。

