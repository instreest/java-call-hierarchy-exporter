# PDE のビルド設定。Eclipse 上で開いて開発するときに使う。
#
# ソースは src-ui/（プラグインのコード）だけ。解析本体（リポジトリ直下の src/）は
# ここではコンパイルしない。あちらは Java 17 でコンパイルして lib/jche-core.jar に収め、
# 子プロセスで動かすものだから（docs/out-of-process-analysis-design.md）。
#
# lib/ の中身（jche-core.jar と jdt/*.jar）は Maven が作る。PDE で動かす前に一度
#   mvn -f eclipse-plugin/pom.xml package
# を実行して target/classes/lib/ を作り、eclipse-plugin/lib/ へコピーしておくこと。
source.. = src-ui/
output.. = bin/
bin.includes = META-INF/,\
               .,\
               plugin.xml,\
               lib/
