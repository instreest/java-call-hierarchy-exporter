# PDE のビルド設定。「デプロイ可能なプラグイン及びフラグメント」でのエクスポートと、
# ワークスペース内のビルドの両方がこのファイルを見る。
#
# source.. の src/ はリンクフォルダで、実体はリポジトリ直下の src/（.project の
# linkedResources を参照）。CLI と同じソースをそのままバンドルへ入れるため、複製は持たない。
# src-ui/ はプラグイン側だけのコード（ハンドラ・コンソール）。
source.. = src/,\
           src-ui/
output.. = bin/
bin.includes = META-INF/,\
               .,\
               plugin.xml
