# java-call-hierarchy-exporter でこのサンプルを解析するための設定。相対パスの起点はこのファイルのフォルダ。
# 依存 jar は pom.xml を読んでローカルリポジトリ（~/.m2/repository）から集めるので、
# 先に一度 mvn package（または mvn dependency:go-offline）で取得しておく。
project.root=.
# 起点を Web の入口（コントローラ）に絞る
entry.packages=com.example.orderexport.web.**
# JDK の中への呼び出し（XMLStreamWriter など）は行にしない
exclude.packages=java.**,javax.**
# 出力先。実行ごとに output/<解析開始日時>_jjug-order-export/ ができる
output.folder=./output
