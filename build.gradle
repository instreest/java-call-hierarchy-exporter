plugins {
    id 'java'
}

version = '0.1.0'

// ---------------------------------------------------------------------------
// Eclipse JDT Core のバージョン
//
// 新しい版ほど、動かすのに新しいJDKを要求し、解析できるJavaバージョンも上がります。
//     3.46.0 … JRE 17以上で動作。ソースは Java 26 まで解析可
//     3.33.0 … JRE 11以上で動作。ソースは Java 19 まで解析可
// 手元のJDKで動く版を選んでください。コマンドラインから上書きできます:
//     gradle -PjdtVersion=3.33.0 run --args="config/config.properties"
//
// 解析対象ソースのJavaバージョンは、この版とは別に config.properties の
// source.level で指定します（未指定なら、この版が対応する最大値）。
// ---------------------------------------------------------------------------
ext {
    jdtVersion = project.findProperty('jdtVersion') ?: '3.46.0'
    mainClassName = 'CallHierarchyExporter'
}

repositories {
    mavenCentral()

    // 社内Nexus等を使う場合はこちらを追加し、mavenCentral() を外してください
    // maven {
    //     url 'https://nexus.example.co.jp/repository/maven-public/'
    //     allowInsecureProtocol = false
    // }
}

dependencies {
    implementation "org.eclipse.jdt:org.eclipse.jdt.core:${jdtVersion}"
}

// ソースは src 直下に1ファイル。Mavenレイアウト（src/main/java）ではない
sourceSets {
    main {
        java.srcDirs = ['src']
    }
}

java {
    // 解析対象のJavaバージョンとは無関係です（このツール自身が動くJVMの話）。
    // 既定の JDT 3.46.0 が JRE 17 を要求するため、それに合わせています。
    // 古いJDKしか無い環境では -PjdtVersion=3.33.0 と合わせて 11 に下げてください。
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // 行番号情報は必須。false にすると出力CSVからソース行が消えます
    options.debug = true
    options.compilerArgs << '-Xlint:all'
}

jar {
    manifest {
        attributes(
            'Main-Class': mainClassName,
            'Implementation-Title': 'java-call-hierarchy-exporter',
            'Implementation-Version': project.version
        )
    }
}

// ---------------------------------------------------------------------------
// 依存jarを lib フォルダに集める。
//
// README の「Pleiades/Eclipse環境」の手順は、Eclipseのpluginsから必要なjarを
// lib へコピーして javac / java を直接叩く。Gradleが使える環境では、
// 代わりにこのタスクで同じ lib フォルダを用意できる。
//     gradle copyLibs
// ---------------------------------------------------------------------------
tasks.register('copyLibs', Copy) {
    description = '依存jarを lib フォルダに集める'
    group = 'build'
    from configurations.runtimeClasspath
    into "$projectDir/lib"
}

// ---------------------------------------------------------------------------
// Gradleからそのまま実行する
//     gradle run --args="config/config.properties"
// ---------------------------------------------------------------------------
tasks.register('run', JavaExec) {
    description = 'ツールを実行する（例: gradle run --args="config/config.properties"）'
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = mainClassName
    // 標準出力の文字コードは明示的に固定しない。設定ファイルやCSVの読み書きは
    // コード側で常に明示的な文字コードを使っており、ここでの指定はコンソールの
    // ログ表示にしか効かない。固定すると、Windowsのコンソール（既定はShift_JIS系）
    // と食い違って文字化けするため、JVM/OSの既定（＝端末に合わせた文字コード）に任せる。
}
