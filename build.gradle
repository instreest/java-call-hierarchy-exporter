plugins {
    id 'java'
}

version = '0.1.0'

// ---------------------------------------------------------------------------
// Eclipse JDT Core のバージョン
//
// 新しい版ほど、動かすのに新しいJDKを要求します。手元のJDKで動く版を選んでください。
// コマンドラインから上書きできます:
//     gradle -PjdtVersion=3.29.0 run --args="config/config.properties"
// ---------------------------------------------------------------------------
ext {
    jdtVersion = project.findProperty('jdtVersion') ?: '3.33.0'
    mainClassName = 'CallHierarchyExporter'
}

repositories {
    mavenCentral()

    // 社内Nexus等を使う場合はこちらを追加し、mavenCentral() を外してください
    // maven {
    //     url 'https://nexus.example.co.jp/repository/maven-public/'
    //     allowInsecureProtocol = false
    // }
}

dependencies {
    implementation "org.eclipse.jdt:org.eclipse.jdt.core:${jdtVersion}"
}

java {
    // 解析対象のJavaバージョンとは無関係です（このツール自身が動くJVMの話）
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // 行番号情報は必須。false にすると出力CSVからソース行が消えます
    options.debug = true
    options.compilerArgs << '-Xlint:all'
}

jar {
    manifest {
        attributes(
            'Main-Class': mainClassName,
            'Implementation-Title': 'java-call-hierarchy-exporter',
            'Implementation-Version': project.version
        )
    }
}

tasks.register('printClasspath') {
    description = '実行時クラスパスを出力する（java -cp にそのまま使える）'
    group = 'help'
    doLast {
        println configurations.runtimeClasspath.asPath
    }
}

// ---------------------------------------------------------------------------
// Gradleからそのまま実行する（jarのビルドやrun.shの用意が不要）
//     gradle run --args="config/config.properties"
// ---------------------------------------------------------------------------
tasks.register('run', JavaExec) {
    description = 'ツールを実行する（例: gradle run --args="config/config.properties"）'
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = mainClassName
    // 標準出力の文字コードは明示的に固定しない。設定ファイルやCSVの読み書きは
    // コード側で常に明示的な文字コードを使っており、ここでの指定はコンソールの
    // ログ表示にしか効かない。固定すると、Windowsのコンソール（既定はShift_JIS系）
    // と食い違って文字化けするため、JVM/OSの既定（＝端末に合わせた文字コード）に任せる。
}

// ---------------------------------------------------------------------------
// 検証用ハーネス
//
// JUnitは使わず、main()を持つ検証クラスを順に実行して OK/NG を集計します。
// 依存を増やさないための割り切りです。
//     gradle verify
// ---------------------------------------------------------------------------
sourceSets {
    test {
        java.srcDirs = ['src/test/java']
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

tasks.register('verify') {
    description = '同梱の検証クラスを順に実行する'
    group = 'verification'
    dependsOn tasks.testClasses
    doLast {
        def targets = [
            'SmokeTest', 'ResolveTest', 'OutputFormatTest', 'WholeProjectTest', 'CycleTest'
        ]
        def failed = []
        targets.each { name ->
            println "--- ${name} ---"
            def result = javaexec {
                classpath = sourceSets.test.runtimeClasspath
                mainClass = name
                systemProperty 'file.encoding', 'UTF-8'
                ignoreExitValue = true
            }
            if (result.exitValue != 0) {
                failed << name
            }
        }
        if (!failed.isEmpty()) {
            throw new GradleException("検証に失敗: ${failed}")
        }
        println '検証: 全て成功'
    }
}
