# test/jls/run.sh（Java 言語仕様 SE 26 への適合と javac との整合の検査）が解析する設定。
# 相対パスの起点はこのファイルのフォルダ。source.level は JDT が対応する最新の 26 に固定する
# （既定の「JDT の最新」に任せると、JDT を上げたときに検査の前提が黙って変わるため）
project.root=.
source.folders=src
library.folders=
source.encoding=UTF-8
source.level=26
entry.packages=
exclude.packages=java.**,javax.**
max.depth=50
max.rows=100000
dataflow.enabled=true
output.encoding=UTF-8
# 出力とキャッシュは run.sh が毎回消してから作り直す（.gitignore 済み）
output.folder=./out
cache.folder=./.cache
