# test/cacheversion の題材 4: test/demo を依存 jar（test/demo/deps/missing-lib.jar）ありで解析する。
# jar の型を継承したソースの型（fx.dao.LibBackedDao extends missing.lib.LibDao implements fx.dao.Dao）と、
# jar の型への呼び出し（fx.app.Legacy）があり、L 行（依存 jar）と、jar を経由した親型（H 行）・解決した呼び出しの事実が出る
project.root=../demo
source.folders=src
library.folders=deps
library.build.tool=none
source.encoding=UTF-8
source.level=17
cache.enabled=false
cache.folder=./.cache/demojar
dataflow.enabled=true
output.encoding=UTF-8
output.folder=./out
