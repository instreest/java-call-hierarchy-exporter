# 回帰テスト用の設定（whole と同じ解析対象・同じ設定で、独自の注釈を Bean 登録の印に足す spring.di.bean.annotations=Audited）。
# 相対パスの起点はこのファイルのフォルダ
project.root=../../demo
source.folders=src
library.folders=
source.encoding=UTF-8
external.library.folders=extjars
source.level=
entry.packages=
exclude.packages=java.**,javax.**,fx.excluded.**
cache.enabled=true
# whole と同じ解析対象なので、既定のキャッシュ（ツールのプロジェクトフォルダの .cache/demo_<ハッシュ>/）を
# 共有しないよう、このフォルダの下に置く
cache.folder=./.cache
max.depth=50
max.rows=100000
dataflow.enabled=true
dataflow.max.depth=5
# このケースの眼目。test/demo の fx.di.AuditedLedger に付けた独自注釈 @Audited（単純名で照合する）を Bean の印にする。
# whole では fx.di.Billing#bill の ledger.post は CHA の 2 候補（AuditedLedger / PlainLedger）のままだが、
# ここでは Bean の AuditedLedger に絞られる（SPRING_DI）。既定の印（@Service 等）はそのまま残る
spring.di.bean.annotations=Audited
output.encoding=UTF-8-BOM
call.rules.files=call-rules.txt
# 出力先。回帰テストは期待出力 expected*/ と同じ階層に実行結果が混ざらないよう output/ の下に出す
output.folder=./output
