# 回帰テスト用の設定（values ケース。test/regression/run.sh）。相対パスの起点はこのファイルのフォルダ。
#
# 値そのもの（文字列リテラル・定数）が、以前の読み手の出所の文字列の文法の文字（| ; { }）を含む書き方を集めた題材
# （project/src）。以前の読み手は値を出所の文字列に組み直してから区切り文字で分けていたので、値を途中で切って
# 読み違え、誤って [UNREACHABLE] にしたり、契約表の別の行に当てたりしていた。読み手が値の表
# （jche.graph.ValueStore）を読むようになって（stage B）、値を切り詰めずに読む。expected/ はその正しい結果で、
# 各ファイルの先頭のコメントに、以前の誤りと今の期待を書いてある。
# config-nodataflow.properties は同じ題材を dataflow.enabled=false で解析する（expected-nodataflow/）。
project.root=project
source.folders=src
library.folders=
source.encoding=UTF-8
source.level=
entry.packages=
exclude.packages=java.**,javax.**
cache.enabled=true
cache.folder=./.cache
max.depth=50
max.rows=100000
dataflow.enabled=true
dataflow.max.depth=5
output.encoding=UTF-8
contracts.files=contracts.txt
output.folder=./output
