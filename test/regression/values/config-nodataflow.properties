# 回帰テスト用の設定（values ケースの 2 つ目）。config.properties と同じ題材を dataflow.enabled=false で解析する。
# 値の行を読まないので、具象クラスの解決は CHA（と契約表の型の行）まで、条件分岐の打ち切りは起きない。
# 値の読み方をどう変えても、この指定の出力（expected-nodataflow/）は変わらない
project.root=project
source.folders=src
library.folders=
source.encoding=UTF-8
source.level=
entry.packages=
exclude.packages=java.**,javax.**
cache.enabled=true
cache.folder=./.cache
max.depth=50
max.rows=100000
dataflow.enabled=false
dataflow.max.depth=5
output.encoding=UTF-8
contracts.files=contracts.txt
output.folder=./output
