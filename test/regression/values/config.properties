# 回帰テスト用の設定（values ケース。test/regression/run.sh）。相対パスの起点はこのファイルのフォルダ。
#
# 値そのもの（文字列リテラル・定数）が、読み手の出所の文字列の文法の文字（| ; { }）を含む書き方を集めた題材
# （project/src）。値の読み手を文字列から値の表へ移す前（stage B の B1）に、その時点の出力を
# 「特性の記録（characterization）」として expected/ に置いた。つまり expected/ には、今の読み手が値を
# 途中で切って読み違えた結果（誤った [UNREACHABLE]・誤った契約の当て方）がそのまま入っている。
# 読み手を値の表へ移すコミット（B3）で expected/ を差し替え、その差分を 1 行ずつ確かめる
# （各ファイルの先頭のコメントに、移す前と後の期待を書いてある）。Kind.java（無名パッケージ）だけは
# 移す前に直した（B0a）ので、expected/ も直した後の結果になっている。
# config-nodataflow.properties は同じ題材を dataflow.enabled=false で解析する（expected-nodataflow/）。
project.root=project
source.folders=src
library.folders=
source.encoding=UTF-8
source.level=
entry.packages=
exclude.packages=java.**,javax.**
cache.enabled=true
cache.folder=./.cache
max.depth=50
max.rows=100000
dataflow.enabled=true
dataflow.max.depth=5
output.encoding=UTF-8
contracts.files=contracts.txt
output.folder=./output
