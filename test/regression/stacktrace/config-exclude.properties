# 回帰テスト用の設定（stacktrace ケース。test/regression/run.sh）。相対パスの起点はこのファイルのフォルダ。
#
# call-hierarchy.csv の caller 列（Java のスタックトレース形式）が、JVM のスタックトレースと同じ
# 「クラス（バイナリ名）・メソッド・ファイル・行」を指すことを見る題材（project/src）。
#   Chain.java   複数行にまたがる連鎖の各呼び出しが、その呼び出しの行になる
#   Lambdas.java 別のファイルのクラスが実行するラムダでも、caller 列がラムダを書いたメソッドとその行を指す
#   Shapes.java  内部クラス・匿名クラス・ローカルクラスのバイナリ名と、ファイル名と違うトップレベルクラス
# config-exclude.properties は、ラムダを実行する側（st.util）を exclude.packages で除外した設定
# （除外したメソッドの名前が、ラムダ本体の行の caller 列に出てはならない）。
project.root=project
source.folders=src
library.folders=
source.encoding=UTF-8
source.level=
entry.packages=
exclude.packages=java.**,javax.**,st.util.**
cache.enabled=true
cache.folder=./.cache
max.depth=50
max.rows=100000
dataflow.enabled=true
dataflow.max.depth=5
output.encoding=UTF-8
output.folder=./output
