# 回帰テスト用の設定（whole と同じ解析対象・同じ設定で、同梱のライブラリ呼び出し規則を使わない call.rules.builtin=false）。
# 相対パスの起点はこのファイルのフォルダ
project.root=../../demo
source.folders=src
library.folders=
source.encoding=UTF-8
external.library.folders=extjars
source.level=
entry.packages=
exclude.packages=java.**,javax.**,fx.excluded.**
cache.enabled=true
# whole と同じ解析対象なので、既定のキャッシュ（ツールのプロジェクトフォルダの .cache/demo_<ハッシュ>/）を
# 共有しないよう、このフォルダの下に置く
cache.folder=./.cache
max.depth=50
max.rows=100000
dataflow.enabled=true
dataflow.max.depth=5
# このケースの眼目。同梱のライブラリ呼び出し規則（JDK の呼び戻し jche.graph.JdkCallbacks と、フレームワークの入口
# BundledFrameworkEntries）を使わない。whole では Thread#start() → run() などの規則で繋がる呼び戻し
# （RESOLVED:CALLBACK）が、jar の中から呼ばれるものとして繋がらないままになる。
# 自前の規則（call-rules.txt。Dispatcher#submit の呼び戻しと @Endpoint の入口）だけは whole と同じに効く。
# ライブラリ呼び出し規則は読み手の判断なので、キャッシュは whole と同じものを書く
call.rules.builtin=false
output.encoding=UTF-8-BOM
call.rules.files=call-rules.txt
# 出力先。回帰テストは期待出力 expected*/ と同じ階層に実行結果が混ざらないよう output/ の下に出す
output.folder=./output
