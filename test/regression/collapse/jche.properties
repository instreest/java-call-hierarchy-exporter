# 回帰テスト用の設定（whole と同じ解析対象・同じ設定で、ラムダの合成メソッドを段にしない hierarchy.collapse.lambda=true）。
# 相対パスの起点はこのファイルのフォルダ
project.root=../../demo
source.folders=src
library.folders=
source.encoding=UTF-8
external.library.folders=extjars
source.level=
entry.packages=
exclude.packages=java.**,javax.**,fx.excluded.**
cache.enabled=true
# cache.folder は空欄のまま。既定どおり、このツールのプロジェクトフォルダの .cache/demo_<ハッシュ>/ にできる経路を検査する
# whole と同じ解析対象なので、既定のキャッシュを共有しないよう、このフォルダの下に置く
cache.folder=./.cache
max.depth=50
max.rows=100000
dataflow.enabled=true
dataflow.max.depth=5
# このケースの眼目。ラムダの本体の呼び出しを、作ったメソッドの直下に出す（Eclipse の呼び出し階層と同じ見え方）
hierarchy.collapse.lambda=true
output.encoding=UTF-8-BOM
# 出力先。既定は「.」（設定ファイルと同じフォルダ）だが、回帰テストは期待出力 expected*/ と同じ階層に
# 実行結果が混ざらないよう output/ の下に出す（比較は output/ の最新フォルダに対して行う）
contracts.files=contracts.txt
output.folder=./output
