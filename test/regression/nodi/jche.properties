# 回帰テスト用の設定（whole と同じ解析対象・同じ設定で、DI コンテナ（Spring）の Bean 定義を読まない spring.di.enabled=false）。
# 相対パスの起点はこのファイルのフォルダ
project.root=../../demo
source.folders=src
library.folders=
source.encoding=UTF-8
external.library.folders=extjars
source.level=
entry.packages=
exclude.packages=java.**,javax.**,fx.excluded.**
cache.enabled=true
# whole と同じ解析対象なので、既定のキャッシュ（ツールのプロジェクトフォルダの .cache/demo_<ハッシュ>/）を
# 共有しないよう、このフォルダの下に置く
cache.folder=./.cache
max.depth=50
max.rows=100000
dataflow.enabled=true
dataflow.max.depth=5
# このケースの眼目。whole では SPRING_DI / SPRING_DI_QUALIFIER で 1 件に絞れる fx.di の呼び出しが、
# Bean 定義を読まないので CHA の候補のまま（UNEXPANDED:CHA。候補は全部行に出る）になる。
# Bean 定義は解析の事実（キャッシュ）ではなく読み手の判断なので、キャッシュは whole と同じものを書く
spring.di.enabled=false
output.encoding=UTF-8-BOM
contracts.files=contracts.txt
# 出力先。回帰テストは期待出力 expected*/ と同じ階層に実行結果が混ざらないよう output/ の下に出す
output.folder=./output
