# 回帰テスト用の設定（Maven プロジェクトの依存jar自動取得）。相対パスの起点はこのファイルのフォルダ
# library.folders は空欄。ソースフォルダの上位（test/maven-demo）の pom.xml を読み、
# 依存の jar と POM は test/localrepo（library.repositories）から探す
project.root=../../maven-demo
source.folders=src/main/java
library.folders=
library.build.tool=auto
library.repositories=../../localrepo
source.encoding=UTF-8
external.library.folders=
source.level=
entry.packages=
exclude.packages=java.**,javax.**
cache.enabled=true
cache.folder=./.cache
max.depth=50
max.rows=100000
dataflow.enabled=true
dataflow.max.depth=5
output.encoding=UTF-8-BOM
