# 回帰テスト用の設定（Maven プロジェクトの依存jar自動取得）。相対パスの起点はこのファイルのフォルダ
# library.folders は空欄。project.root（samples）には pom.xml が無いので、ソースフォルダの上位
# （samples/maven-demo）の pom.xml を見つけて Maven を実行する経路を通る
project.root=../../../samples
source.folders=maven-demo/src/main/java
library.folders=
library.build.tool=auto
library.maven.args=
source.encoding=UTF-8
external.library.folders=
source.level=
entry.packages=
exclude.packages=java.**,javax.**
cache.enabled=true
cache.folders=./.cache
max.depth=50
max.rows=100000
dataflow.enabled=true
dataflow.max.depth=5
output.encoding=UTF-8-BOM
output.csv=./output/call-hierarchy.csv
methods.csv=./output/methods.csv
