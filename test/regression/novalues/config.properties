# 回帰テスト用の設定（whole と同じ解析対象・同じ設定で、値の行を読まない dataflow.enabled=false）。
# 相対パスの起点はこのファイルのフォルダ
project.root=../../demo
source.folders=src
library.folders=
source.encoding=UTF-8
external.library.folders=extjars
source.level=
entry.packages=
exclude.packages=java.**,javax.**,fx.excluded.**
cache.enabled=true
# whole と同じ解析対象なので、既定のキャッシュ（ツールのプロジェクトフォルダの .cache/demo_<ハッシュ>/）を
# 共有しないよう、このフォルダの下に置く
cache.folder=./.cache
max.depth=50
max.rows=100000
# このケースの眼目。キャッシュは同じように書き、読むときに値の行（値グラフ・戻り値の出所・
# フィールドへの代入・証拠・呼び出し箇所の値）を読まない
dataflow.enabled=false
dataflow.max.depth=5
output.encoding=UTF-8-BOM
contracts.files=contracts.txt
# 出力先。回帰テストは期待出力 expected*/ と同じ階層に実行結果が混ざらないよう output/ の下に出す
output.folder=./output
