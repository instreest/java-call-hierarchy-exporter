# 種類 C のライブラリ呼び出し規則だけで絞る（拡張は使わない）。expected-call-rules
project.root=../../plugin-demo
source.folders=src
library.folders=
source.encoding=UTF-8
source.level=
entry.packages=fxp.App
exclude.packages=java.**,javax.**
cache.enabled=true
cache.folder=./.cache
max.depth=50
max.rows=100000
dataflow.enabled=true
dataflow.max.depth=5
output.encoding=UTF-8
output.folder=./output

# --- ライブラリ呼び出し規則（種類 C: 具象型） ---------------------------------------
# 拡張（resolver.*）は使わず、ライブラリ呼び出し規則の 1 行だけで絞れることを見る
call.rules.files=call-rules.txt
