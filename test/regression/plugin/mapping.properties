# 証拠（種別@値）から具象型を引く。フェーズAの FactoryKeyCollector が拾ったキー
FACTORY_KEY@USER_DAO = fxp.UserDaoImpl
FACTORY_KEY@ORDER_DAO = fxp.OrderDaoImpl
# find() を宣言せず親から継承している型。宣言だけを引くと候補にならない（Issue #131）
FACTORY_KEY@REPORT_DAO = fxp.ReportDaoImpl

# 宣言型から具象型を引く。DI 設定から機械的に書き出せる形
fxp.Service = fxp.BillingService

# 「一度も引かれなかった行」の知らせの検査用。この左辺は解析対象のどこにも現れないので
# 出力は変わらず、実行ログにだけ挙がる（test/regression/run.sh）
FACTORY_KEY@NO_SUCH_KEY = fxp.UserDaoImpl
