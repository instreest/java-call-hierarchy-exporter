# 同梱の拡張だけを使う（Java は書かない）。ファクトリのキーと対応表で1件に絞る（expected）
project.root=../../plugin-demo
source.folders=src
library.folders=
source.encoding=UTF-8
source.level=
entry.packages=fxp.App
exclude.packages=java.**,javax.**
cache.enabled=true
cache.folder=./.cache
max.depth=50
max.rows=100000
dataflow.enabled=true
dataflow.max.depth=5
output.encoding=UTF-8
output.folder=./output

# --- 拡張 -----------------------------------------------------------
# フェーズA: ファクトリメソッドの実引数のキーを証拠として残す
resolver.hint.collectors=jche.builtin.FactoryKeyCollector
plugin.factory.methods=fxp.DaoFactory#get

# フェーズB: 証拠と宣言型から具象型を引く
resolver.candidate.providers=jche.builtin.TypeMappingProvider
plugin.mapping.files=mapping.properties
