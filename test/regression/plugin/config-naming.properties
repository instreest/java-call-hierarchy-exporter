# 算出規則を書いた自前の拡張。フェーズAの設定なしでファクトリのキーが届くことを見る
project.root=../../plugin-demo
source.folders=src
library.folders=
source.encoding=UTF-8
source.level=
entry.packages=fxp.App
exclude.packages=java.**,javax.**
cache.enabled=true
cache.folder=./.cache
max.depth=50
max.rows=100000
dataflow.enabled=true
dataflow.max.depth=5
output.encoding=UTF-8
output.folder=./output

# --- 拡張（算出規則） -----------------------------------------------
# resolver.hint.collectors も plugin.factory.methods も書かない
plugin.folders=plugins
resolver.candidate.providers=demo.NamingProvider
