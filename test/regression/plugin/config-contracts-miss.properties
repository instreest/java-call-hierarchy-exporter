# 右辺を採用できない契約表。CHA に戻るので出力は拡張なし（expected-before）と同じ
project.root=../../plugin-demo
source.folders=src
library.folders=
source.encoding=UTF-8
source.level=
entry.packages=fxp.App
exclude.packages=java.**,javax.**
cache.enabled=true
cache.folder=./.cache
max.depth=50
max.rows=100000
dataflow.enabled=true
dataflow.max.depth=5
output.encoding=UTF-8
output.folder=./output

# --- 契約表（種類 C: 具象型） ---------------------------------------
# 拡張（resolver.*）は使わず、契約表の 1 行だけで絞れることを見る
contracts.files=contracts-miss.txt
