# 自前の拡張（plugins/DiXmlProvider.java）を実行時にコンパイルして使う（expected-custom）
project.root=../../plugin-demo
source.folders=src
library.folders=
source.encoding=UTF-8
source.level=
entry.packages=fxp.App
exclude.packages=java.**,javax.**
cache.enabled=true
cache.folder=./.cache
max.depth=50
max.rows=100000
dataflow.enabled=true
dataflow.max.depth=5
output.encoding=UTF-8
output.folder=./output

# --- 拡張 -----------------------------------------------------------
# .java を置いたフォルダ。実行時にコンパイルされる（jar / class を置いてもよい）
plugin.folders=plugins
resolver.candidate.providers=demo.DiXmlProvider
# 自前の拡張が独自に読む設定（キー名は拡張の作者が決める）
demo.di.file=di.xml
