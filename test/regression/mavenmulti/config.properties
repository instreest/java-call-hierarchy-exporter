# 回帰テスト用の設定（マルチモジュール Maven の依存jar自動取得）。相対パスの起点はこのファイルのフォルダ
# project.root はアグリゲータ。モジュールごとの pom.xml を読み、app の兄弟モジュール core への依存はリアクタで解決する
project.root=../../maven-multi
source.folders=core/src/main/java,app/src/main/java
library.folders=
library.build.tool=auto
library.repositories=../../localrepo
source.encoding=UTF-8
external.library.folders=
source.level=
entry.packages=
exclude.packages=java.**,javax.**
cache.enabled=true
cache.folders=./.cache
max.depth=50
max.rows=100000
dataflow.enabled=true
dataflow.max.depth=5
output.encoding=UTF-8-BOM
output.csv=./output/call-hierarchy.csv
methods.csv=./output/methods.csv
