# 回帰テスト用の設定（Gradle プロジェクトの依存jar自動取得）。相対パスの起点はこのファイルのフォルダ
# project.root は Eclipse（Buildship）のプロジェクトとして .project / .classpath を持つ app。source.folders も
# 空欄にして .classpath の kind="src" から取る。settings.gradle は上位（test/gradle-demo）にある
project.root=../../gradle-demo/app
source.folders=
library.folders=
library.build.tool=auto
library.repositories=../../localrepo
source.encoding=UTF-8
external.library.folders=
source.level=
entry.packages=
exclude.packages=java.**,javax.**
cache.enabled=true
cache.folder=./.cache
max.depth=50
max.rows=100000
dataflow.enabled=true
dataflow.max.depth=5
output.encoding=UTF-8-BOM
# 出力先。既定は「.」（設定ファイルと同じフォルダ）だが、回帰テストは期待出力 expected*/ と同じ階層に
# 実行結果が混ざらないよう output/ の下に出す（比較は output/ の最新フォルダに対して行う）
output.folder=./output
