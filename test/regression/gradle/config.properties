# 回帰テスト用の設定（Gradle プロジェクトの依存jar自動取得）。相対パスの起点はこのファイルのフォルダ
# library.folders は空欄。project.root に build.gradle があり、Eclipse（Buildship）の .project / .classpath も
# ある形。source.folders も空欄にして .classpath の kind="src" から取る
project.root=../../../samples/gradle-demo
source.folders=
library.folders=
library.build.tool=auto
library.gradle.args=
source.encoding=UTF-8
external.library.folders=
source.level=
entry.packages=
exclude.packages=java.**,javax.**
cache.enabled=true
cache.folders=./.cache
max.depth=50
max.rows=100000
dataflow.enabled=true
dataflow.max.depth=5
output.encoding=UTF-8-BOM
output.csv=./output/call-hierarchy.csv
methods.csv=./output/methods.csv
