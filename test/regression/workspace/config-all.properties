# 同じ結合を workspace.scope=all で。相手の、自分に届かない階層（Unrelated.standalone）も出る
project.root=../../demo
source.folders=src
library.folders=
source.encoding=UTF-8
external.library.folders=
workspace.projects=../../workspace-demo
workspace.scope=all
source.level=
entry.packages=
exclude.packages=java.**,javax.**,fx.excluded.**
cache.enabled=true
cache.folder=./.cache
max.depth=50
max.rows=100000
dataflow.enabled=true
dataflow.max.depth=5
output.encoding=UTF-8-BOM
output.folder=./output
