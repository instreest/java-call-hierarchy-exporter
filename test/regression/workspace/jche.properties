# ワークスペースの他のプロジェクト（test/workspace-demo。フォルダの形。.classpath から中身を決める）を結合する。
# 相手は相手自身の設定（demo-app.jar をクラスパスに持つ）で解析され、そのキャッシュをこの実行のグラフに名前で結合する
project.root=../../demo
source.folders=src
library.folders=
source.encoding=UTF-8
external.library.folders=
workspace.projects=../../workspace-demo
workspace.scope=callers
source.level=
entry.packages=
exclude.packages=java.**,javax.**,fx.excluded.**
cache.enabled=true
cache.folder=./.cache
max.depth=50
max.rows=100000
dataflow.enabled=true
dataflow.max.depth=5
output.encoding=UTF-8-BOM
output.folder=./output
