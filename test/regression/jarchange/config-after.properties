# 回帰テスト用の設定（依存 jar の追加・削除）。相対パスの起点はこのファイルのフォルダ
# config-before.properties との違いは library.folders だけ。キャッシュと出力先は共有する
project.root=../../../samples/demo
source.folders=src
library.folders=deps
source.encoding=UTF-8
external.library.folders=
source.level=
entry.packages=fx.app.Legacy
exclude.packages=java.**,javax.**,fx.excluded.**
cache.enabled=true
cache.folders=./.cache
max.depth=50
max.rows=100000
dataflow.enabled=true
dataflow.max.depth=5
output.encoding=UTF-8-BOM
output.csv=./output/call-hierarchy.csv
methods.csv=./output/methods.csv
