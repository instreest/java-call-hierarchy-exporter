# 回帰テスト用の設定（依存 jar の追加・削除）。相対パスの起点はこのファイルのフォルダ
# config-after.properties との違いは library.folders だけ。キャッシュ（同じ project.root なので同じフォルダ）と出力先は共有する
project.root=../../demo
source.folders=src
library.folders=
source.encoding=UTF-8
external.library.folders=
source.level=
entry.packages=fx.app.Legacy,fx.service.OrderService#execute
exclude.packages=java.**,javax.**,fx.excluded.**
cache.enabled=true
cache.folder=./.cache
max.depth=50
max.rows=100000
dataflow.enabled=true
dataflow.max.depth=5
output.encoding=UTF-8-BOM
# 出力先。既定は「.」（設定ファイルと同じフォルダ）だが、回帰テストは期待出力 expected*/ と同じ階層に
# 実行結果が混ざらないよう output/ の下に出す（比較は output/ の最新フォルダに対して行う）
output.folder=./output
