# 文言の検査用の設定。相対パスの起点はこのファイルのフォルダ。
# 出力 CSV が言語で変わらないこと（CSV は英語で固定）を見るために、同じ設定で
# 英語と日本語の 2 回解析して突き合わせる。注記（[UNEXPANDED:*] など）が出る形にしてある
project.root=../demo
source.folders=src
library.folders=
source.encoding=UTF-8
external.library.folders=extjars
source.level=
entry.packages=fx.app.*,fx.service.OrderService#execute
exclude.packages=java.**,javax.**,fx.excluded.**
cache.enabled=true
cache.folder=./.cache
max.depth=50
max.rows=100000
dataflow.enabled=true
dataflow.max.depth=5
conditions.target=fx.branch.Feature
output.encoding=UTF-8-BOM
output.folder=./output
