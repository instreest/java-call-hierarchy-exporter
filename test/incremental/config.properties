# 差分更新の検査用の設定。解析対象は work/ に複製したソース（src/ は書き換えない）。
# 相対パスの起点はこのファイルのフォルダ
project.root=./work
source.folders=src
library.folders=
library.build.tool=none
source.encoding=UTF-8
source.level=
# inc.OneLineLambdas は、同じ行に並ぶメソッドとラムダの起点の並びを見るため（run.sh の「同じ行に並ぶ宣言」）
entry.packages=inc.Main,inc.OneLineLambdas
exclude.packages=java.**,javax.**
cache.enabled=true
cache.folder=./.cache
max.depth=50
max.rows=100000
dataflow.enabled=true
dataflow.max.depth=5
branch.pruning.enabled=true
output.encoding=UTF-8
output.folder=./out
