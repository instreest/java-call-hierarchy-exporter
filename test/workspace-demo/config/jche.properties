# test/workspace-demo を自分の project.root として解析する設定。回帰テスト test/regression/workspace の
# config-file.properties が workspace.projects にこのファイルを指す（設定ファイルの形）。
# cache.folder はこの設定のフォルダの下（配下の制限があるので外は指せない）
project.root=..
source.folders=src
library.jars=../../demo/extjars/demo-app.jar
source.encoding=UTF-8
cache.folder=.cache
output.folder=.cache/output
