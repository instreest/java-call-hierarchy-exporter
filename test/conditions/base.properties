# 条件の調査（conditions.target）の検査用（bash test/conditions/run.sh）。解析対象は test/demo。
# ケースごとに、このファイルへ conditions.target の1行を足した case.properties を作って渡す。
# キャッシュと出力フォルダの場所をこのフォルダの下に向けておき、
# 調査モードがどちらも作らないこと・通常の解析なら作ることを検査できるようにする。
project.root=../demo
source.folders=src
source.encoding=UTF-8
cache.folder=./.cache
output.folder=./out
