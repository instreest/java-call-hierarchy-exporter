dependencies {
    // 同じビルドの他プロジェクト。そのビルドファイルの依存（greeter とその推移的な依存 core）も集まる。
    // core のクラス自体は、Eclipse（Buildship）や Gradle でビルドした出力（bin/main、build/classes）があるときだけ解決できる
    implementation project(':core')
    // Kotlin DSL（kts/build.gradle.kts）のプロジェクト。版カタログの util（libs.sample.util）はそちらだけが宣言する。
    // .kts を読めなければ util の jar が集まらず、Service の Strings.upper が型解決に失敗して期待出力と食い違う
    implementation project(':kts')
}
