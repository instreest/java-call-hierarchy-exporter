# test/dataflow の TraceCheck・ValueStoreCheck が解析する題材（CheckProjects.java の STRICT の paths）。
# 相対パスの起点はこのファイルのフォルダ。検査はキャッシュと出力を test/dataflow/work/paths/ に差し替えて使う。
#
# 値の読み手（DataflowResolver・GuardEvaluator・StreamingTreeWalker・DataflowBuilder・CallbackContracts）の
# 分かれ道のうち、test/demo などの題材では踏まないものを 1 つずつ踏むための小さなプロジェクト
# （src/pp の各ファイルの先頭に、どの分かれ道を踏むかを書いてある）。読み手を値の表へ移す間（stage B）、
# 経路の記録（test/dataflow/trace/paths.txt）が 1 文字も変わらないことで、移し替えの取りこぼしを見つける。
# config-mapping.properties は同じ題材に TypeMappingProvider を付けたもの（拡張へ渡す証拠の種別を見る）。
project.root=.
source.folders=src
library.folders=
source.encoding=UTF-8
source.level=
entry.packages=
exclude.packages=java.**,javax.**
cache.enabled=true
cache.folder=./.cache
max.depth=50
max.rows=100000
dataflow.enabled=true
dataflow.max.depth=5
output.encoding=UTF-8
output.folder=./output
