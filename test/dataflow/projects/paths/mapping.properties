# TypeMappingProvider の対応表（config-mapping.properties）。証拠の種別@値 = 実装の型
# KindFactory.get(DaoKind.A) は、列挙定数のキー（FACTORY_CONST）で ADao に絞る。
# 同じ値を FACTORY_KEY で書いた行は置かない（種別を取り違えると当たらないことを見るため）
FACTORY_CONST@pp.DaoKind.A = pp.ADao
# StrFactory.get(key()) は、key() が返す文字列のキー（FACTORY_KEY）で CDao に絞る
FACTORY_KEY@KEY_C = pp.CDao
