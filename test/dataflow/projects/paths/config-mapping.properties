# config.properties と同じ題材に、組み込みの拡張 TypeMappingProvider（mapping.properties）を付けたもの
# （CheckProjects.java の STRICT の paths-mapping）。ファクトリに渡した列挙定数のキーが、拡張へ
# FACTORY_CONST の証拠として渡ること（CallResolver#hintKindOf）を、経路の記録の解決の名前（MAPPING）で見る。
project.root=.
source.folders=src
library.folders=
source.encoding=UTF-8
source.level=
entry.packages=
exclude.packages=java.**,javax.**
cache.enabled=true
cache.folder=./.cache
max.depth=50
max.rows=100000
dataflow.enabled=true
dataflow.max.depth=5
output.encoding=UTF-8
output.folder=./output
resolver.candidate.providers=jche.builtin.TypeMappingProvider
plugin.mapping.files=mapping.properties
