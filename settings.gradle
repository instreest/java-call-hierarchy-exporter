// ---------------------------------------------------------------------------
// ツールチェーンの自動取得
//
// 手元にこのツールが要求するJDKが無い場合、Gradleに取ってこさせるための解決役。
// これが無いと「JDK 17 が見つかりません」で止まり、利用者が自分でJDKを
// 入れる必要がある（＝Quick startが1コマンドで終わらない）。
//
// 取得したJDKは GRADLE_USER_HOME/jdks に置かれる。gradlew / gradlew.bat が
// GRADLE_USER_HOME をプロジェクト内の .gradle-home に向けているので、
// 利用者のホームには何も残らない。
//
// 手元に条件を満たすJDKが既にあれば、それが使われ取得は起きない。
// ---------------------------------------------------------------------------
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'java-call-hierarchy-exporter'
